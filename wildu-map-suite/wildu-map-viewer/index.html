<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wildu Map Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    :root {
      --bg: #0f1712;
      --panel: rgba(18, 28, 21, .92);
      --text: #f3f8f1;
      --muted: #aab8a8;
      --line: rgba(255,255,255,.14);
      --accent: #a7d129;
      --gold: #f5b400;
      --danger: #ff6b6b;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; background: var(--bg); }
    body { color: var(--text); overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; }
    .topbar {
      position: absolute; left: 10px; right: 10px; top: 10px; z-index: 500;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.26); backdrop-filter: blur(12px);
    }
    .titlebox { padding: 10px 12px; min-width: 0; max-width: min(540px, calc(100vw - 24px)); }
    .title { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; justify-content: flex-end; }
    button, label.file-btn, select {
      border: 0; border-radius: 13px; padding: 9px 10px; background: rgba(255,255,255,.08); color: var(--text);
      font-weight: 800; font-size: 12px; cursor: pointer;
    }
    button.active { background: var(--accent); color: #142008; }
    button.gold { background: var(--gold); color: #231800; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    #area-select { max-width: 200px; border: 1px solid var(--line); }
    .status {
      position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 500;
      pointer-events: none; display: flex; justify-content: center;
    }
    .status > div {
      pointer-events: auto; max-width: 720px; padding: 9px 12px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
      font-size: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.22); backdrop-filter: blur(12px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .gps-hud {
      position: absolute;
      left: 10px;
      bottom: 56px;
      z-index: 520;
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-start;
      pointer-events: none;
      max-width: min(520px, calc(100vw - 20px));
    }

    .gps-chip {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(18, 28, 21, .92);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
      backdrop-filter: blur(12px);
    }

    .gps-chip .gps-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #778078;
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
      flex: 0 0 auto;
    }

    .gps-chip.active {
      color: #eaffd8;
      border-color: rgba(167, 209, 41, .42);
      background: rgba(28, 48, 24, .94);
    }

    .gps-chip.active .gps-dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(167, 209, 41, .18);
    }

    .gps-chip.warn {
      color: #ffe8a8;
      border-color: rgba(245, 180, 0, .42);
      background: rgba(52, 39, 14, .92);
    }

    .gps-chip.warn .gps-dot {
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(245, 180, 0, .16);
    }

    .gps-chip.off {
      color: var(--muted);
    }

    .gps-precision {
      opacity: .82;
      font-weight: 750;
    }

    .safety-note {
      pointer-events: auto;
      max-width: 500px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(10, 16, 12, .72);
      color: rgba(243,248,241,.72);
      font-size: 10.5px;
      line-height: 1.3;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
    }

    .gps-toast {
      position: absolute;
      left: 50%;
      top: 78px;
      transform: translateX(-50%) translateY(-8px);
      z-index: 900;
      max-width: min(520px, calc(100vw - 24px));
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(18, 28, 21, .96);
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 16px 44px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .gps-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .gps-toast.ok {
      border-color: rgba(167, 209, 41, .45);
    }

    .gps-toast.warn {
      border-color: rgba(245, 180, 0, .50);
    }

    .gps-toast.err {
      border-color: rgba(255, 107, 107, .55);
      color: #ffd4d4;
    }
    .waypoint-popup { min-width: 220px; max-width: 280px; }
    .waypoint-popup h3 { margin: 0 0 6px; font-size: 15px; }
    .waypoint-popup p { margin: 6px 0; line-height: 1.35; }
    .waypoint-popup img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 12px; margin-top: 8px; display: block; }
    .waypoint-popup small { color: #667; display: block; margin-top: 6px; }
    .leaflet-control-attribution { font-size: 10px; }
    .leaflet-popup-content-wrapper { border-radius: 16px; }
    @media (max-width: 760px) {
      .topbar { flex-direction: column; align-items: stretch; }
      .titlebox { max-width: none; }
      .controls { justify-content: flex-start; }
      button, label.file-btn, select { font-size: 11px; padding: 8px 9px; }
      .status > div { border-radius: 16px; white-space: normal; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="panel titlebox">
      <div id="area-title" class="title">Wildu Map</div>
      <div id="area-subtitle" class="subtitle">Caricamento area...</div>
    </div>
    <div class="panel controls">
      <select id="area-select" title="Scegli area"></select>
      <button id="btn-waypoints" class="active">Wildu Waypoints</button>
      <button id="btn-tracks" class="active">Tracce</button>
      <label class="file-btn" for="local-gpx">Carica GPX</label>
      <input id="local-gpx" type="file" accept=".gpx,application/gpx+xml,text/xml,application/xml" />
     <button id="btn-gps" class="gold" title="Attiva/disattiva tracking GPS">📍 Posizione GPS</button>
    </div>
  </div>

  <div class="gps-hud">
    <div id="gps-status-chip" class="gps-chip off" aria-live="polite">
      <span class="gps-dot"></span>
      <span id="gps-status-text">GPS spento</span>
      <span id="gps-precision-value" class="gps-precision">Precisione: —</span>
    </div>

    <div class="safety-note">
      Serve internet per funzionare. L’attività all’aperto va svolta con prudenza e in modo coerente con le proprie abilità, sotto la propria responsabilità.
    </div>
  </div>

  <div id="gps-toast" class="gps-toast" aria-live="polite"></div>

  <div class="status"><div id="status">Avvio mappa...</div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.2.0/gpx.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, where
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { firebaseConfig, WILDU_MAP_COLLECTIONS, WILDU_MAP_CONFIG } from "../shared/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    const initialAreaSlug = params.get("area") || params.get("areaSlug") || "";

    const state = {
      map: null,
      areas: [],
      area: null,
      waypointsLayer: L.layerGroup(),
      tracksLayer: L.layerGroup(),
      localTracksLayer: L.layerGroup(),
      gpsMarker: null,
      gpsCircle: null,
      gpsWatchId: null,
      gpsTrackingActive: false,
      gpsLastFix: null,
      gpsInitialCenterDone: false,
      gpsToastTimer: null,
      showWaypoints: true,
      showTracks: true
    };

    function setStatus(msg, isError = false) {
      const el = $("status");
      el.textContent = msg;
      el.style.color = isError ? "#ffd4d4" : "#aab8a8";
      el.parentElement.style.display = msg ? "flex" : "none";
    }

    function setGpsHud(mode, label, accuracyMeters) {
      const chip = $("gps-status-chip");
      const text = $("gps-status-text");
      const precision = $("gps-precision-value");

      if (!chip || !text || !precision) return;

      chip.classList.remove("active", "warn", "off");
      chip.classList.add(mode || "off");

      text.textContent = label || "GPS spento";

      if (Number.isFinite(Number(accuracyMeters))) {
        precision.textContent = `Precisione: ~${Math.round(Number(accuracyMeters))} m`;
      } else {
        precision.textContent = "Precisione: —";
      }
    }

    function showGpsToast(message, type = "ok") {
      const toast = $("gps-toast");
      if (!toast) return;

      toast.textContent = message;
      toast.classList.remove("ok", "warn", "err", "show");
      toast.classList.add(type);

      if (state.gpsToastTimer) {
        clearTimeout(state.gpsToastTimer);
        state.gpsToastTimer = null;
      }

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      state.gpsToastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    }
    function safeUrl(s) {
      const v = String(s || "").trim();
      return /^https:\/\//i.test(v) ? v : "";
    }
    function sortByOrderTitle(a, b) {
      return (Number(a.sortOrder || 0) - Number(b.sortOrder || 0)) || String(a.title || "").localeCompare(String(b.title || ""));
    }

function initMap() {
  state.map = L.map("map", { zoomControl: true }).setView(
    WILDU_MAP_CONFIG.defaultCenter,
    WILDU_MAP_CONFIG.defaultZoom
  );

  // Base topografica: rilievi, curve, terreno.
  const topoBaseLayer = L.tileLayer(WILDU_MAP_CONFIG.tileUrl, {
    maxZoom: WILDU_MAP_CONFIG.tileMaxZoom,
    attribution: WILDU_MAP_CONFIG.tileAttribution
  }).addTo(state.map);

  // Overlay escursionistico: sentieri/route hiking numerate quando disponibili in OSM.
  // Nota: è raster, quindi non possiamo cambiare lo spessore reale delle linee.
  // Lo rendiamo meno invasivo nascondendolo agli zoom bassi e attenuandolo agli zoom intermedi.
  const hikingRoutesLayer = L.tileLayer("https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png", {
    maxZoom: 18,
    opacity: 0.85,
    attribution: 'Hiking routes © <a href="https://waymarkedtrails.org/" target="_blank" rel="noopener">Waymarked Trails</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
  });

  const HIKING_MIN_ZOOM = 12;
  let hikingUserEnabled = true;
  let hikingAutoChanging = false;

  function syncHikingRoutesLayer() {
    const z = state.map.getZoom();
    const shouldShow = hikingUserEnabled && z >= HIKING_MIN_ZOOM;

    hikingAutoChanging = true;

    if (shouldShow && !state.map.hasLayer(hikingRoutesLayer)) {
      hikingRoutesLayer.addTo(state.map);
    }

    if (!shouldShow && state.map.hasLayer(hikingRoutesLayer)) {
      state.map.removeLayer(hikingRoutesLayer);
    }

    hikingAutoChanging = false;

    if (shouldShow) {
      if (z <= 12) hikingRoutesLayer.setOpacity(0.45);
      else if (z === 13) hikingRoutesLayer.setOpacity(0.65);
      else hikingRoutesLayer.setOpacity(0.85);
    }
  }

  state.map.on("zoomend", syncHikingRoutesLayer);

  state.map.on("overlayadd", function(e) {
    if (e.layer === hikingRoutesLayer && !hikingAutoChanging) {
      hikingUserEnabled = true;
      syncHikingRoutesLayer();
    }
  });

  state.map.on("overlayremove", function(e) {
    if (e.layer === hikingRoutesLayer && !hikingAutoChanging) {
      hikingUserEnabled = false;
    }
  });

  // Layer Wildu e tracce sopra la mappa.
  state.waypointsLayer.addTo(state.map);
  state.tracksLayer.addTo(state.map);
  state.localTracksLayer.addTo(state.map);

  L.control.layers(
    {
      "Mappa topografica": topoBaseLayer
    },
    {
      "Sentieri escursionistici": hikingRoutesLayer,
      "Wildu Waypoints": state.waypointsLayer,
      "Tracce GPX Wildu": state.tracksLayer,
      "GPX personali": state.localTracksLayer
    },
    {
      collapsed: true
    }
  ).addTo(state.map);

  syncHikingRoutesLayer();
}

    async function loadAreas() {
      const q = query(
        collection(db, WILDU_MAP_COLLECTIONS.AREAS),
        where("status", "==", "ACTIVE"),
        where("visibility", "==", "PUBLIC")
      );
      const snap = await getDocs(q);
      state.areas = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(sortByOrderTitle);
      renderAreaSelect();
      if (!state.areas.length) throw new Error("Nessuna area mappa pubblica trovata.");
      const selected = state.areas.find(a => a.areaSlug === initialAreaSlug || a.id === initialAreaSlug) || state.areas[0];
      await selectArea(selected.areaSlug || selected.id);
    }

    function renderAreaSelect() {
      $("area-select").innerHTML = state.areas.map(a => {
        const slug = a.areaSlug || a.id;
        return `<option value="${escapeHtml(slug)}">${escapeHtml(a.title || slug)}</option>`;
      }).join("");
      $("area-select").style.display = state.areas.length > 1 ? "block" : "none";
    }

    async function selectArea(areaSlug) {
      const area = state.areas.find(a => a.areaSlug === areaSlug || a.id === areaSlug);
      if (!area) return;
      state.area = area;
      $("area-select").value = area.areaSlug || area.id;
      $("area-title").textContent = area.title || area.areaSlug || "Wildu Map";
      $("area-subtitle").textContent = area.subtitle || area.description || "Mappa escursionistica con Wildu Waypoints e tracce GPX.";
      const lat = Number(area.centerLat || WILDU_MAP_CONFIG.defaultCenter[0]);
      const lng = Number(area.centerLng || WILDU_MAP_CONFIG.defaultCenter[1]);
      const zoom = Number(area.defaultZoom || 13);
      state.map.setView([lat, lng], zoom);
      await Promise.all([loadWaypoints(area.areaSlug || area.id), loadTracks(area.areaSlug || area.id)]);
      fitUsefulBounds();
    }

    async function loadWaypoints(areaSlug) {
      state.waypointsLayer.clearLayers();
      const q = query(
        collection(db, WILDU_MAP_COLLECTIONS.WAYPOINTS),
        where("areaSlug", "==", areaSlug),
        where("status", "==", "ACTIVE"),
        where("visibility", "==", "PUBLIC")
      );
      const snap = await getDocs(q);
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(sortByOrderTitle);
      items.forEach(addWaypointMarker);
      setStatus(`${items.length} Wildu Waypoints caricati.`);
    }

    function waypointIcon(type) {
      const label = ({
        VIEWPOINT: "⛰️", WATER: "💧", PARKING: "🅿️", NATURE: "🌿", INFO: "📍", CUSTOM: "⭐"
      })[String(type || "INFO").toUpperCase()] || "📍";
      return L.divIcon({
        className: "wildu-waypoint-icon",
        html: `<div style="width:30px;height:30px;border-radius:999px;display:grid;place-items:center;background:#a7d129;color:#142008;border:2px solid white;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:15px;">${label}</div>`,
        iconSize: [30,30], iconAnchor: [15,30], popupAnchor: [0,-28]
      });
    }

    function addWaypointMarker(w) {
      const lat = Number(w.lat), lng = Number(w.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const img = safeUrl(w.imageUrl)
        ? `<img loading="lazy" src="${escapeHtml(safeUrl(w.imageUrl))}" alt="${escapeHtml(w.imageAlt || w.title || "Wildu Waypoint")}" />`
        : "";
      const credit = w.imageCredit ? `<small>${escapeHtml(w.imageCredit)}</small>` : "";
      const html = `
        <div class="waypoint-popup">
          <h3>${escapeHtml(w.title || "Wildu Waypoint")}</h3>
          <p>${escapeHtml(w.description || "")}</p>
          ${img}
          ${credit}
        </div>`;
      L.marker([lat, lng], { icon: waypointIcon(w.iconType) }).bindPopup(html).addTo(state.waypointsLayer);
    }

    async function loadTracks(areaSlug) {
      state.tracksLayer.clearLayers();
      const q = query(
        collection(db, WILDU_MAP_COLLECTIONS.TRACKS),
        where("areaSlug", "==", areaSlug),
        where("status", "==", "ACTIVE"),
        where("visibility", "==", "PUBLIC")
      );
      const snap = await getDocs(q);
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(sortByOrderTitle);
      let loaded = 0;
      items.forEach(t => {
        const url = safeUrl(t.fileUrl);
        if (!url || !window.L.GPX) return;
        const layer = new L.GPX(url, {
          async: true,
          polyline_options: { color: "#f5b400", weight: 4, opacity: 0.9 }
        });
        layer.on("loaded", () => { loaded++; setStatus(`${loaded}/${items.length} tracce GPX caricate.`); });
        layer.on("error", () => setStatus(`Errore caricamento GPX: ${t.title || t.id}`, true));
        layer.addTo(state.tracksLayer);
      });
      if (!items.length) setStatus("Nessuna traccia GPX pubblica per quest’area.");
    }

    function fitUsefulBounds() {
      const group = L.featureGroup();
      state.waypointsLayer.eachLayer(l => group.addLayer(l));
      state.tracksLayer.eachLayer(l => {
        if (typeof l.getBounds === "function") group.addLayer(l);
      });
      try {
        const b = group.getBounds();
        if (b.isValid()) state.map.fitBounds(b.pad(0.2));
      } catch (_) {}
    }

    function toggleLayer(kind) {
      if (kind === "waypoints") {
        state.showWaypoints = !state.showWaypoints;
        if (state.showWaypoints) state.waypointsLayer.addTo(state.map); else state.map.removeLayer(state.waypointsLayer);
        $("btn-waypoints").classList.toggle("active", state.showWaypoints);
      }
      if (kind === "tracks") {
        state.showTracks = !state.showTracks;
        if (state.showTracks) state.tracksLayer.addTo(state.map); else state.map.removeLayer(state.tracksLayer);
        $("btn-tracks").classList.toggle("active", state.showTracks);
      }
    }

    function loadLocalGpx(file) {
      if (!file) return;
      if (!/\.gpx$/i.test(file.name)) { setStatus("Carica un file .gpx.", true); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const blob = new Blob([reader.result], { type: "application/gpx+xml" });
        const url = URL.createObjectURL(blob);
        const layer = new L.GPX(url, {
          async: true,
          polyline_options: { color: "#ff6b6b", weight: 4, opacity: 0.9 }
        });
        layer.on("loaded", (e) => {
          state.localTracksLayer.addLayer(layer);
          try { state.map.fitBounds(e.target.getBounds().pad(0.2)); } catch (_) {}
          setStatus("GPX personale caricato solo localmente, senza invio al server.");
        });
        layer.on("error", () => setStatus("Errore lettura GPX locale.", true));
      };
      reader.onerror = () => setStatus("Errore lettura file locale.", true);
      reader.readAsText(file);
    }

function locateUser() {
  const btn = $("btn-gps");

if (!navigator.geolocation) {
  setGpsHud("warn", "GPS non disponibile", null);
  showGpsToast("GPS non disponibile su questo browser", "err");
  setStatus("GPS non disponibile su questo browser.", true);
  return;
}

  // Se il tracking è già attivo, il click lo spegne.
  if (state.gpsWatchId != null) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
    state.gpsTrackingActive = false;

btn.classList.remove("active");
btn.textContent = "📍 Posizione GPS";

setGpsHud("off", "GPS spento", null);
showGpsToast("Tracking GPS disattivato", "warn");
setStatus("Tracking GPS disattivato.");
return;
  }

  state.gpsTrackingActive = true;
  state.gpsLastFix = null;
  state.gpsInitialCenterDone = false;

btn.disabled = false;
btn.classList.add("active");
btn.textContent = "📍 GPS attivo";

setGpsHud("warn", "Aggancio GPS...", null);
showGpsToast("Tracking GPS attivato", "ok");
setStatus("Tracking GPS attivo. Il browser può chiederti il permesso di usare la posizione.");

  function getGpsIcon() {
    return L.divIcon({
      className: "wildu-gps-position-icon",
      html: `
        <div style="
          width:34px;
          height:34px;
          border-radius:999px;
          background:#2f80ff;
          border:3px solid white;
          box-shadow:0 0 0 8px rgba(47,128,255,.22), 0 6px 18px rgba(0,0,0,.45);
          display:grid;
          place-items:center;
          color:white;
          font-size:16px;
          font-weight:900;
        ">●</div>
      `,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -18]
    });
  }

  function zoomForAccuracy(acc) {
    if (acc <= 25) return 16;
    if (acc <= 60) return 15;
    if (acc <= 150) return 14;
    if (acc <= 400) return 13;
    return 12;
  }

  function distanceMeters(a, b) {
    if (!a || !b) return 999999;

    const R = 6371000;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;

    const x =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1) * Math.cos(lat2) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);

    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function renderGpsFix(fix) {
    const lat = fix.lat;
    const lng = fix.lng;
    const acc = fix.acc;

    if (!state.gpsMarker) {
      state.gpsMarker = L.marker([lat, lng], {
        icon: getGpsIcon(),
        zIndexOffset: 5000
      }).addTo(state.map);

      state.gpsCircle = L.circle([lat, lng], {
        radius: acc,
        color: "#2f80ff",
        weight: 2,
        opacity: 0.75,
        fillColor: "#2f80ff",
        fillOpacity: 0.12
      }).addTo(state.map);
    } else {
      state.gpsMarker.setLatLng([lat, lng]);
      state.gpsCircle.setLatLng([lat, lng]).setRadius(acc);
    }

    state.gpsMarker.bindPopup(`📍 Sei qui<br>Precisione circa ${Math.round(acc)} m`);

if (acc <= 60) {
  setGpsHud("active", "GPS preciso", acc);
} else if (acc <= 250) {
  setGpsHud("warn", "GPS approssimativo", acc);
} else {
  setGpsHud("warn", "GPS poco preciso", acc);
}
  }

  function centerOnFix(fix, mode) {
    const targetZoom = zoomForAccuracy(fix.acc);

    if (mode === "first") {
      state.map.flyTo([fix.lat, fix.lng], targetZoom, {
        animate: true,
        duration: 0.8
      });
      state.gpsMarker.openPopup();
      return;
    }

    // Durante la camminata non zoomiamo di continuo:
    // ci limitiamo a seguire dolcemente la posizione.
    state.map.panTo([fix.lat, fix.lng], {
      animate: true,
      duration: 0.5
    });
  }

  state.gpsWatchId = navigator.geolocation.watchPosition(pos => {
    const fix = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      acc: pos.coords.accuracy || 9999,
      timestamp: Date.now()
    };

    const moved = distanceMeters(state.gpsLastFix, fix);

    state.gpsLastFix = fix;
    renderGpsFix(fix);

    if (!state.gpsInitialCenterDone) {
      state.gpsInitialCenterDone = true;
      centerOnFix(fix, "first");
      setStatus(`GPS attivo. Precisione circa ${Math.round(fix.acc)} m.`);
      return;
    }

    // Aggiorna la visuale solo se ti sei mosso davvero.
    // Evita tremolii quando il GPS balla da fermo.
    if (moved >= 8) {
      centerOnFix(fix, "follow");
      setStatus(`GPS aggiornato. Spostamento rilevato: circa ${Math.round(moved)} m. Precisione circa ${Math.round(fix.acc)} m.`);
    } else {
      setStatus(`GPS attivo. Precisione circa ${Math.round(fix.acc)} m.`);
    }

  }, err => {
    let msg = "Errore GPS.";

    if (err && err.code === 1) {
      msg = "Permesso GPS negato. Abilita la posizione dalle impostazioni del sito.";
    } else if (err && err.code === 2) {
      msg = "Posizione non disponibile. Controlla GPS, rete o permessi del dispositivo.";
    } else if (err && err.code === 3) {
      msg = "Timeout GPS. Riprovo automaticamente finché il tracking resta attivo.";
    }

    setGpsHud("warn", "GPS in errore", null);
setStatus(msg, true);

    if (err && err.code === 1) {
      if (state.gpsWatchId != null) {
        navigator.geolocation.clearWatch(state.gpsWatchId);
        state.gpsWatchId = null;
      }

state.gpsTrackingActive = false;
btn.classList.remove("active");
btn.textContent = "📍 Posizione GPS";

setGpsHud("off", "GPS spento", null);
showGpsToast("Tracking GPS non autorizzato", "err");
    }
  }, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 5000
  });
}

    function bind() {
      $("btn-waypoints").onclick = () => toggleLayer("waypoints");
      $("btn-tracks").onclick = () => toggleLayer("tracks");
      $("btn-gps").onclick = locateUser;
      $("local-gpx").onchange = (e) => loadLocalGpx(e.target.files[0]);
      $("area-select").onchange = () => selectArea($("area-select").value).catch(e => setStatus(e.message, true));
      window.addEventListener("resize", () => setTimeout(() => state.map.invalidateSize(), 120));
    }

    initMap();
    bind();
    loadAreas().catch(e => setStatus(e.message, true));
  </script>
</body>
</html>

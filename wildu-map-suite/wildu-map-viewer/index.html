<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wildu Map Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    :root {
      --bg: #0f1712;
      --panel: rgba(18, 28, 21, .92);
      --text: #f3f8f1;
      --muted: #aab8a8;
      --line: rgba(255,255,255,.14);
      --accent: #a7d129;
      --gold: #f5b400;
      --danger: #ff6b6b;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; background: var(--bg); }
    body { color: var(--text); overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; }
.topbar {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 10px;
  z-index: 700;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  justify-content: flex-start;

  /* Importante: evita click involontari sui controlli Leaflet/OpenTopoMap sotto la barra */
  pointer-events: auto;
}
    .panel {
      pointer-events: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.26); backdrop-filter: blur(12px);
    }
    .titlebox-hidden { display: none !important; }
.titlebox { padding: 10px 12px; min-width: 0; max-width: min(540px, calc(100vw - 24px)); }
    .title { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 7px;
  justify-content: flex-start;
  align-items: center;
  flex: 1 1 auto;

  /* Ora Esci non occupa più spazio nella topbar */
  width: min(760px, calc(100vw - 20px));
  max-width: calc(100vw - 20px);
}
    
button, label.file-btn, select {
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 12px;
  padding: 7px 8px;
  background: rgba(10, 18, 13, .96);
  color: #f3f8f1;
  font-weight: 850;
  font-size: 11.5px;
  cursor: pointer;
  color-scheme: dark;
  white-space: nowrap;
}

select option {
  background: #172319;
  color: #f3f8f1;
}
    button.active { background: var(--accent); color: #142008; }
    button.gold { background: var(--gold); color: #231800; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    #area-select {
  width: auto;
  min-width: 104px;
  max-width: 138px;
  border: 1px solid rgba(255,255,255,.20);
  background: rgba(8, 16, 12, .98);
  color: #f3f8f1;
}
    .status {
      position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 500;
      pointer-events: none; display: flex; justify-content: center;
    }
    .status > div {
      pointer-events: auto; max-width: 720px; padding: 9px 12px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
      font-size: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.22); backdrop-filter: blur(12px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .gps-hud {
      position: absolute;
      left: 10px;
      bottom: 56px;
      z-index: 520;
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-start;
      pointer-events: none;
      max-width: min(520px, calc(100vw - 20px));
    }

.gps-chip {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(18, 28, 21, .92);
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  box-shadow: 0 12px 30px rgba(0,0,0,.24);
  backdrop-filter: blur(12px);
}

button.gps-chip {
  width: auto;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  max-width: 142px;
  overflow: hidden;
}

#gps-status-text {
  max-width: 72px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

button.gps-chip:hover {
  transform: translateY(-1px);
}

    .gps-chip .gps-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #778078;
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
      flex: 0 0 auto;
    }

    .gps-chip.active {
      color: #eaffd8;
      border-color: rgba(167, 209, 41, .42);
      background: rgba(28, 48, 24, .94);
    }

    .gps-chip.active .gps-dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(167, 209, 41, .18);
    }

    .gps-chip.warn {
      color: #ffe8a8;
      border-color: rgba(245, 180, 0, .42);
      background: rgba(52, 39, 14, .92);
    }

    .gps-chip.warn .gps-dot {
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(245, 180, 0, .16);
    }

    .gps-chip.off {
      color: var(--muted);
    }

    .gps-precision {
      opacity: .82;
      font-weight: 750;
    }

.safety-note {
  pointer-events: auto;
  max-width: 500px;
  padding: 8px 10px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(10, 16, 12, .72);
  color: rgba(243,248,241,.72);
  font-size: 10.5px;
  line-height: 1.3;
  box-shadow: 0 10px 24px rgba(0,0,0,.18);
  backdrop-filter: blur(10px);
  transition: opacity .35s ease, transform .35s ease;
}

.safety-note.is-hidden {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}

.hidden {
  display: none !important;
}

.exit-btn {
  position: fixed;
  right: max(12px, env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 900;

  pointer-events: auto;
  border: 1px solid rgba(255,107,107,.68);
  background: rgba(128, 28, 28, .96);
  color: #ffffff;
  border-radius: 999px;
  padding: 10px 15px;
  white-space: nowrap;
  box-shadow: 0 14px 34px rgba(0,0,0,.36);
  backdrop-filter: blur(12px);
  font-weight: 950;
  font-size: 13px;
}

.exit-btn:hover {
  background: rgba(165, 38, 38, .98);
}
    
.local-gpx-remove {
  background: rgba(255,107,107,.22) !important;
  color: #ffd4d4 !important;
  border: 1px solid rgba(255,107,107,.38) !important;
}
    
    .gps-toast {
      position: absolute;
      left: 50%;
      top: 78px;
      transform: translateX(-50%) translateY(-8px);
      z-index: 900;
      max-width: min(520px, calc(100vw - 24px));
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(18, 28, 21, .96);
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 16px 44px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .gps-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .gps-toast.ok {
      border-color: rgba(167, 209, 41, .45);
    }

    .gps-toast.warn {
      border-color: rgba(245, 180, 0, .50);
    }

    .gps-toast.err {
      border-color: rgba(255, 107, 107, .55);
      color: #ffd4d4;
    }
    .waypoint-popup { min-width: 220px; max-width: 280px; }
    .waypoint-popup h3 { margin: 0 0 6px; font-size: 15px; }
    .waypoint-popup p { margin: 6px 0; line-height: 1.35; }
    .waypoint-popup img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 12px; margin-top: 8px; display: block; }
    .waypoint-popup small { color: #667; display: block; margin-top: 6px; }
    .track-popup {
  min-width: 230px;
  max-width: 300px;
}

.track-popup h3 {
  margin: 0 0 7px;
  font-size: 15px;
}

.track-popup p {
  margin: 7px 0;
  line-height: 1.35;
}

.track-popup .track-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 8px 0;
}

.track-popup .track-metric {
  padding: 6px 8px;
  border-radius: 10px;
  background: rgba(167, 209, 41, .12);
  border: 1px solid rgba(167, 209, 41, .25);
  font-size: 12px;
  line-height: 1.25;
}

.track-popup .track-metric strong {
  display: block;
  color: #142008;
  font-size: 11px;
  opacity: .75;
}

.track-popup small {
  color: #667;
  display: block;
  margin-top: 6px;
}
    .leaflet-control-attribution { font-size: 10px; }
    
/* Viewer Wildu: i controlli nativi Leaflet non devono confondere l’utente.
   Zoom: si usa pinch/scroll.
   Layer: si usano i pulsanti Wildu WP/Tracce/GPX. */
.leaflet-control-zoom,
.leaflet-control-layers {
  display: none !important;
}
    
@media (max-width: 760px) {
  .topbar {
    flex-direction: row;
    align-items: flex-start;
    gap: 5px;
  }

  .titlebox { max-width: none; }

.controls {
  justify-content: flex-start;
  width: calc(100vw - 20px);
  max-width: calc(100vw - 20px);
  gap: 4px;
  padding: 6px;
}

  button, label.file-btn, select {
    font-size: 10px;
    padding: 6px 6px;
    border-radius: 10px;
  }

  #area-select {
    min-width: 94px;
    max-width: 116px;
  }

  .gps-chip {
    max-width: 86px;
    gap: 4px;
  }

  #gps-status-text {
    max-width: 42px;
  }

  .gps-precision {
    display: none;
  }

.exit-btn {
  font-size: 12px;
  padding: 9px 13px;
}

.leaflet-control-zoom,
.leaflet-control-layers {
  display: none !important;
}

  .status > div {
    border-radius: 16px;
    white-space: normal;
  }
}


    
@media (max-width: 640px) {
.topbar {
  gap: 0;
  padding: 0;
  left: 8px;
  right: 8px;
}

.topbar button,
.topbar select,
.topbar label.file-btn {
  font-size: 10.5px;
  padding: 6px 7px;
}

  .gps-hud {
    left: 8px;
    right: 8px;
    bottom: 52px;
    max-width: calc(100vw - 16px);
  }

  .gps-chip {
    font-size: 11px;
    padding: 7px 9px;
    max-width: 100%;
    flex-wrap: wrap;
  }

  .safety-note {
    max-width: 100%;
    font-size: 9.5px;
    line-height: 1.25;
    padding: 7px 9px;
    opacity: .86;
  }

  .status {
    left: 8px;
    right: 8px;
    bottom: 8px;
  }

  .status > div {
    max-width: 100%;
    font-size: 10.5px;
    padding: 7px 10px;
  }

  .gps-toast {
    top: 64px;
    font-size: 12px;
    padding: 10px 13px;
  }
}

    
  </style>
</head>
<body>
  <div id="map"></div>

<div class="topbar">
  <div class="titlebox-hidden" aria-hidden="true">
    <div id="area-title" class="title">Wildu Map</div>
    <div id="area-subtitle" class="subtitle">Caricamento area...</div>
  </div>

  <div class="panel controls">
<select id="area-select" title="Scegli area"></select>
<button id="btn-waypoints" class="active" title="Mostra/nascondi Wildu Waypoints">WP</button>
<button id="btn-tracks" class="active" title="Mostra/nascondi tracce Wildu">Tracce</button>

<label id="btn-local-gpx-main" class="file-btn" for="local-gpx" title="Apri una traccia GPX solo sul tuo dispositivo, senza inviarla online">
  GPX
</label>
<input id="local-gpx" type="file" accept=".gpx" />
<button id="btn-local-gpx-toggle" class="hidden" title="Mostra/nascondi la traccia GPX personale">Nascondi GPX</button>

<button id="gps-status-chip" class="gps-chip off" type="button" aria-live="polite" title="Attiva/disattiva tracking GPS">
  <span class="gps-dot"></span>
  <span id="gps-status-text">GPS spento</span>
  <span id="gps-precision-value" class="gps-precision">Precisione: —</span>
</button>
    
  </div>

  <button id="btn-exit-mother" class="exit-btn" title="Torna all’app Wildu">Esci</button>
</div>

<div class="gps-hud">
  <div id="safety-note" class="safety-note">
    Serve internet per funzionare. L’attività all’aperto va svolta con prudenza e in modo coerente con le proprie abilità, sotto la propria responsabilità.
  </div>
</div>

  <div id="gps-toast" class="gps-toast" aria-live="polite"></div>

  <div class="status"><div id="status">Avvio mappa...</div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.2.0/gpx.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { firebaseConfig, WILDU_MAP_COLLECTIONS, WILDU_MAP_CONFIG } from "../shared/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.search);
const initialAreaSlug = params.get("area") || params.get("areaSlug") || "";
const ALL_AREAS_VALUE = "__ALL__";

const WILDU_TRACK_STYLE = {
  color: "#ffb000",
  weight: 6,
  opacity: 0.98
};

const USER_TRACK_STYLE = {
  color: "#00e5ff",
  weight: 6,
  opacity: 0.95,
  dashArray: "10,8"
};    

// Ritorno all’app madre. Se la sezione premi usa un hash diverso,
// in futuro basta cambiare questa singola costante.
//const MOTHER_APP_PREMI_URL = "https://wildustrek.github.io/Wild-U/?";

const state = {
  map: null,
  areas: [],
  area: null,

  // Cache RAM della sessione: evita nuove letture Firestore
  // quando l’utente riapre la stessa area nella stessa pagina.
  areaContentCache: new Map(),
  gpsAreaAutoLoaded: false,

  waypointsLayer: L.layerGroup(),
  tracksLayer: L.layerGroup(),
  localTracksLayer: L.layerGroup(),
  gpsMarker: null,
  gpsCircle: null,
  gpsWatchId: null,
  gpsTrackingActive: false,
  gpsLastFix: null,
  gpsInitialCenterDone: false,
  
gpsToastTimer: null,
safetyNoteTimer: null,
statusHideTimer: null,
localGpxLayer: null,
localGpxVisible: true,
showWaypoints: true,
showTracks: true
  
};

function setStatus(msg, isError = false, sticky = false) {
  const el = $("status");
  if (!el || !el.parentElement) return;

  if (state.statusHideTimer) {
    clearTimeout(state.statusHideTimer);
    state.statusHideTimer = null;
  }

  el.textContent = msg || "";
  el.style.color = isError ? "#ffd4d4" : "#aab8a8";
  el.parentElement.style.display = msg ? "flex" : "none";

  // I messaggi informativi non devono restare a sporcare la mappa.
  // Gli errori restano visibili.
  if (msg && !isError && !sticky) {
    state.statusHideTimer = setTimeout(() => {
      el.parentElement.style.display = "none";
    }, 6500);
  }
}

    function setGpsHud(mode, label, accuracyMeters) {
      const chip = $("gps-status-chip");
      const text = $("gps-status-text");
      const precision = $("gps-precision-value");

      if (!chip || !text || !precision) return;

      chip.classList.remove("active", "warn", "off");
      chip.classList.add(mode || "off");

      text.textContent = label || "GPS spento";

      if (Number.isFinite(Number(accuracyMeters))) {
        precision.textContent = `Precisione: ~${Math.round(Number(accuracyMeters))} m`;
      } else {
        precision.textContent = "Precisione: —";
      }
    }

    function showGpsToast(message, type = "ok") {
      const toast = $("gps-toast");
      if (!toast) return;

      toast.textContent = message;
      toast.classList.remove("ok", "warn", "err", "show");
      toast.classList.add(type);

      if (state.gpsToastTimer) {
        clearTimeout(state.gpsToastTimer);
        state.gpsToastTimer = null;
      }

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      state.gpsToastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    }
    function safeUrl(s) {
      const v = String(s || "").trim();
      return /^https:\/\//i.test(v) ? v : "";
    }
    
function sortByOrderTitle(a, b) {
  return (Number(a.sortOrder || 0) - Number(b.sortOrder || 0)) || String(a.title || "").localeCompare(String(b.title || ""));
}

function clampZoom(value, maxZoom = 17) {
  const z = Number(value);
  const max = Number(maxZoom);

  if (!Number.isFinite(z)) return Math.min(13, Number.isFinite(max) ? max : 17);

  return Math.max(1, Math.min(z, Number.isFinite(max) ? max : 17));
}

function fallbackViewerConfig() {
  return {
    baseMap: WILDU_MAP_CONFIG.baseMapFallback || {
      enabled: true,
      providerId: "opentopomap",
      label: "OpenTopoMap",
      tileUrl: WILDU_MAP_CONFIG.tileUrl,
      attribution: WILDU_MAP_CONFIG.tileAttribution,
      maxZoom: WILDU_MAP_CONFIG.tileMaxZoom || 17
    },
    hikingOverlay: WILDU_MAP_CONFIG.hikingOverlayFallback || {
      enabled: true,
      providerId: "waymarkedtrails_hiking",
      label: "Sentieri escursionistici",
      tileUrl: "https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png",
      attribution: 'Hiking routes © <a href="https://waymarkedtrails.org/" target="_blank" rel="noopener">Waymarked Trails</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>',
      minZoom: 12,
      maxZoom: 18,
      opacity: 0.85
    }
  };
}

function normalizeTileSettings(raw, fallback, kind) {
  const out = { ...(fallback || {}) };

  if (raw && typeof raw === "object") {
    if (typeof raw.enabled === "boolean") out.enabled = raw.enabled;
    if (String(raw.providerId || "").trim()) out.providerId = String(raw.providerId).trim();
    if (String(raw.label || "").trim()) out.label = String(raw.label).trim();
    if (safeUrl(raw.tileUrl)) out.tileUrl = safeUrl(raw.tileUrl);
    if (String(raw.attribution || "").trim()) out.attribution = String(raw.attribution).trim();

    if (Number.isFinite(Number(raw.maxZoom))) {
      out.maxZoom = Math.max(1, Math.min(22, Number(raw.maxZoom)));
    }

    if (kind === "overlay") {
      if (Number.isFinite(Number(raw.minZoom))) {
        out.minZoom = Math.max(1, Math.min(22, Number(raw.minZoom)));
      }

      if (Number.isFinite(Number(raw.opacity))) {
        out.opacity = Math.max(0, Math.min(1, Number(raw.opacity)));
      }
    }
  }

  if (!safeUrl(out.tileUrl)) out.tileUrl = fallback.tileUrl;
  if (!String(out.attribution || "").trim()) {
    out.attribution = fallback.attribution || "© OpenStreetMap contributors";
  }

  return out;
}

async function loadViewerMapConfig() {
  const fallback = fallbackViewerConfig();

  try {
    const ref = doc(
      db,
      WILDU_MAP_COLLECTIONS.SETTINGS || "wildu_map_settings",
      WILDU_MAP_CONFIG.mapSettingsDocId || "viewer_public_config"
    );

    const snap = await getDoc(ref);

    if (!snap.exists()) return fallback;

    const data = snap.data() || {};

    if (data.status && data.status !== "ACTIVE") return fallback;

    return {
      baseMap: normalizeTileSettings(data.baseMap, fallback.baseMap, "base"),
      hikingOverlay: normalizeTileSettings(data.hikingOverlay, fallback.hikingOverlay, "overlay")
    };
  } catch (e) {
    console.warn("[Wildu Map] Config mappa non disponibile, uso fallback.", e);
    return fallback;
  }
}

function syncHikingRoutesLayer() {
  if (!state.map || !state.hikingRoutesLayer) return;

  const cfg = (state.viewerConfig || fallbackViewerConfig()).hikingOverlay || {};
  const minZoom = Number(cfg.minZoom || 12);
  const baseOpacity = Number(cfg.opacity ?? 0.85);
  const z = state.map.getZoom();

  // I sentieri sono automatici:
  // se l’overlay è abilitato e lo zoom lo permette, si vedono.
  // Nessun toggle manuale, nessuno stato utente che può bloccarli.
  const shouldShow = cfg.enabled !== false && z >= minZoom;

  if (shouldShow && !state.map.hasLayer(state.hikingRoutesLayer)) {
    state.hikingRoutesLayer.addTo(state.map);
  }

  if (!shouldShow && state.map.hasLayer(state.hikingRoutesLayer)) {
    state.map.removeLayer(state.hikingRoutesLayer);
  }

  if (shouldShow && typeof state.hikingRoutesLayer.setOpacity === "function") {
    if (z <= minZoom) {
      state.hikingRoutesLayer.setOpacity(Math.max(0.3, baseOpacity * 0.55));
    } else if (z === minZoom + 1) {
      state.hikingRoutesLayer.setOpacity(Math.max(0.45, baseOpacity * 0.75));
    } else {
      state.hikingRoutesLayer.setOpacity(baseOpacity);
    }
  }
}

function initMap() {
  const cfg = state.viewerConfig || fallbackViewerConfig();
  const fallback = fallbackViewerConfig();

  // La base map non deve mai lasciare il viewer senza sfondo:
  // se da admin viene disabilitata o rotta, usiamo il fallback sicuro.
  const baseCfg = cfg.baseMap && cfg.baseMap.enabled !== false
    ? cfg.baseMap
    : fallback.baseMap;

  const baseMaxZoom = clampZoom(baseCfg.maxZoom || WILDU_MAP_CONFIG.tileMaxZoom || 17, 22);
  const startZoom = clampZoom(WILDU_MAP_CONFIG.defaultZoom, baseMaxZoom);

  state.map = L.map("map", {
    zoomControl: true,
    maxZoom: baseMaxZoom
  }).setView(
    WILDU_MAP_CONFIG.defaultCenter,
    startZoom
  );

  const topoBaseLayer = L.tileLayer(baseCfg.tileUrl, {
    maxZoom: Number(baseCfg.maxZoom || 17),
    attribution: baseCfg.attribution || "© OpenStreetMap contributors"
  }).addTo(state.map);

  const hikingCfg = cfg.hikingOverlay || fallback.hikingOverlay;

  if (hikingCfg.enabled !== false && safeUrl(hikingCfg.tileUrl)) {
    state.hikingRoutesLayer = L.tileLayer(hikingCfg.tileUrl, {
      maxZoom: Number(hikingCfg.maxZoom || 18),
      opacity: Number(hikingCfg.opacity ?? 0.85),
      attribution: hikingCfg.attribution || "© OpenStreetMap contributors"
    });

    state.map.on("zoomend", syncHikingRoutesLayer);

// Overlay sentieri gestito automaticamente da syncHikingRoutesLayer()
// in base allo zoom e alla configurazione Firestore.
  }

  state.waypointsLayer.addTo(state.map);
  state.tracksLayer.addTo(state.map);
  state.localTracksLayer.addTo(state.map);

  const overlays = {
    "Wildu Waypoints": state.waypointsLayer,
    "Tracce GPX Wildu": state.tracksLayer,
    "GPX personali": state.localTracksLayer
  };

  if (state.hikingRoutesLayer) {
    overlays[hikingCfg.label || "Sentieri escursionistici"] = state.hikingRoutesLayer;
  }

  L.control.layers(
    {
      [baseCfg.label || "Mappa topografica"]: topoBaseLayer
    },
    overlays,
    {
      collapsed: true
    }
  ).addTo(state.map);

  syncHikingRoutesLayer();
}

async function getAreaContent(areaSlug) {
  if (state.areaContentCache.has(areaSlug)) {
    return {
      ...state.areaContentCache.get(areaSlug),
      fromCache: true
    };
  }

  const [waypoints, tracks] = await Promise.all([
    queryWaypointsForArea(areaSlug),
    queryTracksForArea(areaSlug)
  ]);

  const payload = {
    waypoints,
    tracks,
    loadedAt: Date.now()
  };

  state.areaContentCache.set(areaSlug, payload);

  return {
    ...payload,
    fromCache: false
  };
}

function renderWaypointsOnMap(items) {
  state.waypointsLayer.clearLayers();

  items.forEach(addWaypointMarker);

  return items.length;
}

function renderTracksOnMap(items) {
  state.tracksLayer.clearLayers();

  let loaded = 0;

  items.forEach(t => {
    const url = safeUrl(t.fileUrl);
    if (!url || !window.L.GPX) return;

const layer = new L.GPX(url, {
  async: true,
  polyline_options: WILDU_TRACK_STYLE
});

    bindTrackPopup(layer, t);

    layer.on("loaded", () => {
      loaded++;
      bindTrackPopup(layer, t);
      setStatus(`${loaded}/${items.length} tracce GPX caricate.`);
    });

    layer.on("error", () => setStatus(`Errore caricamento GPX: ${t.title || t.id}`, true));

    layer.addTo(state.tracksLayer);
  });

  return items.length;
}

    function formatTrackMetric(value, suffix) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "—";
  }

  if (suffix === "km") {
    return `${n.toFixed(n % 1 === 0 ? 0 : 1)} km`;
  }

  return `${Math.round(n)} ${suffix}`;
}

function buildTrackPopupHtml(t) {
  const title = escapeHtml(t.title || "Traccia GPX Wildu");
  const desc = escapeHtml(t.description || "");
  const difficulty = escapeHtml(t.difficulty || "N/D");

  const distance = formatTrackMetric(t.distanceKm, "km");
  const gain = formatTrackMetric(t.elevationGainM, "m");
  const loss = formatTrackMetric(t.elevationLossM, "m");

  const hasDescription = !!String(t.description || "").trim();

  return `
    <div class="track-popup">
      <h3>${title}</h3>

      <div class="track-metrics">
        <div class="track-metric">
          <strong>Distanza</strong>
          ${escapeHtml(distance)}
        </div>
        <div class="track-metric">
          <strong>Dislivello +</strong>
          ${escapeHtml(gain)}
        </div>
        <div class="track-metric">
          <strong>Dislivello -</strong>
          ${escapeHtml(loss)}
        </div>
        <div class="track-metric">
          <strong>Difficoltà</strong>
          ${difficulty}
        </div>
      </div>

      ${hasDescription ? `<p>${desc}</p>` : ""}

      <small>Traccia caricata da Wildu. Consulta sempre il percorso con prudenza.</small>
    </div>
  `;
}

function bindTrackPopup(layer, track) {

  });

function fitUsefulBounds() {
  const group = L.featureGroup();

  state.waypointsLayer.eachLayer(l => group.addLayer(l));

  state.tracksLayer.eachLayer(l => {
    if (typeof l.getBounds === "function") group.addLayer(l);
  });

  try {
    const b = group.getBounds();

    if (b.isValid()) {
      const cfg = state.viewerConfig || fallbackViewerConfig();
      const baseCfg = cfg.baseMap || fallbackViewerConfig().baseMap || {};
      const maxZoom = clampZoom(baseCfg.maxZoom || WILDU_MAP_CONFIG.tileMaxZoom || 17, 22);

      state.map.fitBounds(b.pad(0.2), {
        maxZoom: Math.min(15, maxZoom),
        animate: false
      });
    }
  } catch (_) {}
}

function loadLocalGpx(file) {
  if (!file) return;

  if (!/\.gpx$/i.test(file.name)) {
    setStatus("Carica un file .gpx.", true);
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const blob = new Blob([reader.result], { type: "application/gpx+xml" });
    const url = URL.createObjectURL(blob);

    state.localTracksLayer.clearLayers();

    if (!state.map.hasLayer(state.localTracksLayer)) {
      state.localTracksLayer.addTo(state.map);
    }

const layer = new L.GPX(url, {
  async: true,
  polyline_options: USER_TRACK_STYLE
});

    layer.on("loaded", (e) => {
      state.localGpxLayer = layer;
      state.localGpxVisible = true;
      state.localTracksLayer.addLayer(layer);

      try {
        state.map.fitBounds(e.target.getBounds().pad(0.2));
      } catch (_) {}

      updateLocalGpxControls();
      setStatus("GPX personale aperto solo sul tuo dispositivo. Non viene inviato ai server Wildu.");
    });

    layer.on("error", () => setStatus("Errore lettura GPX locale.", true));
  };

  reader.onerror = () => setStatus("Errore lettura file locale.", true);
  reader.readAsText(file);
}


function distanceMetersBetweenCoords(aLat, aLng, bLat, bLng) {
  const R = 6371000;
  const lat1 = Number(aLat) * Math.PI / 180;
  const lat2 = Number(bLat) * Math.PI / 180;
  const dLat = (Number(bLat) - Number(aLat)) * Math.PI / 180;
  const dLng = (Number(bLng) - Number(aLng)) * Math.PI / 180;

  const x =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);

  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function pointInPolygon(point, polygon) {
  const pts = Array.isArray(polygon) ? polygon : [];
  const lat = Number(point.lat);
  const lng = Number(point.lng);

  if (!Number.isFinite(lat) || !Number.isFinite(lng) || pts.length < 3) {
    return false;
  }

  let inside = false;

  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const yi = Number(pts[i].lat);
    const xi = Number(pts[i].lng);
    const yj = Number(pts[j].lat);
    const xj = Number(pts[j].lng);

    if (
      Number.isFinite(xi) &&
      Number.isFinite(yi) &&
      Number.isFinite(xj) &&
      Number.isFinite(yj)
    ) {
      const intersect =
        ((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 0.0000001) + xi);

      if (intersect) inside = !inside;
    }
  }

  return inside;
}

function findNearestAreaForPoint(lat, lng) {
  if (!state.areas.length) return null;

  const point = {
    lat: Number(lat),
    lng: Number(lng)
  };

  const containing = state.areas.find(a => pointInPolygon(point, a.polygon));
  if (containing) return containing;

  let best = null;
  let bestDistance = Infinity;

  state.areas.forEach(a => {
    const centerLat = Number(a.centerLat);
    const centerLng = Number(a.centerLng);

    if (!Number.isFinite(centerLat) || !Number.isFinite(centerLng)) return;

    const d = distanceMetersBetweenCoords(point.lat, point.lng, centerLat, centerLng);

    if (d < bestDistance) {
      bestDistance = d;
      best = a;
    }
  });

  return best;
}

async function autoLoadNearestAreaFromGps(fix) {
  const area = findNearestAreaForPoint(fix.lat, fix.lng);

  if (!area) {
    setStatus(`GPS attivo. Precisione circa ${Math.round(fix.acc)} m. Nessuna area vicina trovata.`);
    return;
  }

  const slug = area.areaSlug || area.id;

  // Non spostiamo la mappa lontano dal GPS:
  // carichiamo i contenuti dell’area vicina, ma lasciamo la vista centrata sulla posizione.
  state.area = area;
  $("area-select").value = slug;
  $("area-title").textContent = area.title || area.areaSlug || "Wildu Map";
  $("area-subtitle").textContent = area.subtitle || area.description || "Contenuti caricati vicino alla tua posizione.";

  await loadAreaContent(slug);

  setStatus(`GPS attivo. Area vicina caricata: ${area.title || slug}. Precisione circa ${Math.round(fix.acc)} m.`);
}

          place-items:center;
          color:white;
          font-size:16px;
          font-weight:900;
        ">●</div>
      `,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -18]
    });
  }

  function zoomForAccuracy(acc) {
    if (acc <= 25) return 16;
    if (acc <= 60) return 15;
    if (acc <= 150) return 14;
    if (acc <= 400) return 13;
    return 12;
  }

  function distanceMeters(a, b) {
    if (!a || !b) return 999999;

    const R = 6371000;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;

    const x =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1) * Math.cos(lat2) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);

    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function renderGpsFix(fix) {
    const lat = fix.lat;
    const lng = fix.lng;
    const acc = fix.acc;

    if (!state.gpsMarker) {
      state.gpsMarker = L.marker([lat, lng], {
        icon: getGpsIcon(),
        zIndexOffset: 5000
      }).addTo(state.map);

      state.gpsCircle = L.circle([lat, lng], {
        radius: acc,
        color: "#2f80ff",
        weight: 2,
        opacity: 0.75,
        fillColor: "#2f80ff",
        fillOpacity: 0.12
      }).addTo(state.map);
    } else {
      state.gpsMarker.setLatLng([lat, lng]);
      state.gpsCircle.setLatLng([lat, lng]).setRadius(acc);
    }

    state.gpsMarker.bindPopup(`📍 Sei qui<br>Precisione circa ${Math.round(acc)} m`);

if (acc <= 60) {
  setGpsHud("active", "GPS preciso", acc);
} else if (acc <= 250) {
  setGpsHud("warn", "GPS approssimativo", acc);
} else {
  setGpsHud("warn", "GPS poco preciso", acc);
}
  }

  function centerOnFix(fix, mode) {
    const targetZoom = zoomForAccuracy(fix.acc);

    if (mode === "first") {
      state.map.flyTo([fix.lat, fix.lng], targetZoom, {
        animate: true,
        duration: 0.8
      });
      state.gpsMarker.openPopup();
      return;
    }

    // Durante la camminata non zoomiamo di continuo:
    // ci limitiamo a seguire dolcemente la posizione.
    state.map.panTo([fix.lat, fix.lng], {
      animate: true,
      duration: 0.5
    });
  }

  state.gpsWatchId = navigator.geolocation.watchPosition(pos => {
    const fix = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      acc: pos.coords.accuracy || 9999,
      timestamp: Date.now()
    };

    const moved = distanceMeters(state.gpsLastFix, fix);

    state.gpsLastFix = fix;
    renderGpsFix(fix);

if (!state.gpsInitialCenterDone) {
  state.gpsInitialCenterDone = true;
  centerOnFix(fix, "first");

  if (!state.area && !state.gpsAreaAutoLoaded) {
    state.gpsAreaAutoLoaded = true;
    autoLoadNearestAreaFromGps(fix).catch(e => setStatus(e.message, true));
  } else {
    setStatus(`GPS attivo. Precisione circa ${Math.round(fix.acc)} m.`);
  }

  return;
}

    // Aggiorna la visuale solo se ti sei mosso davvero.
    // Evita tremolii quando il GPS balla da fermo.
    if (moved >= 8) {
      centerOnFix(fix, "follow");
      setStatus(`GPS aggiornato. Spostamento rilevato: circa ${Math.round(moved)} m. Precisione circa ${Math.round(fix.acc)} m.`);
    } else {
      setStatus(`GPS attivo. Precisione circa ${Math.round(fix.acc)} m.`);
    }

  }, err => {
    let msg = "Errore GPS.";

    if (err && err.code === 1) {
      msg = "Permesso GPS negato. Abilita la posizione dalle impostazioni del sito.";
    } else if (err && err.code === 2) {
      msg = "Posizione non disponibile. Controlla GPS, rete o permessi del dispositivo.";
    } else if (err && err.code === 3) {
      msg = "Timeout GPS. Riprovo automaticamente finché il tracking resta attivo.";
    }

    setGpsHud("warn", "GPS in errore", null);
setStatus(msg, true);

    if (err && err.code === 1) {
      if (state.gpsWatchId != null) {
        navigator.geolocation.clearWatch(state.gpsWatchId);
        state.gpsWatchId = null;
      }

state.gpsTrackingActive = false;
if (btn) btn.classList.remove("active");

setGpsHud("off", "GPS spento", null);
      
showGpsToast("Tracking GPS non autorizzato", "err");
    }
  }, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 5000
  });
}

    function bind() {
      $("btn-waypoints").onclick = () => toggleLayer("waypoints");
      $("btn-tracks").onclick = () => toggleLayer("tracks");
      
$("gps-status-chip").onclick = locateUser;
$("local-gpx").onchange = (e) => loadLocalGpx(e.target.files[0]);

$("btn-local-gpx-main").onclick = (e) => {
  if (state.localGpxLayer) {
    e.preventDefault();
    clearLocalGpx();
  }
};

$("btn-local-gpx-toggle").onclick = () => setLocalGpxVisible(!state.localGpxVisible);
$("btn-exit-mother").onclick = exitToMotherApp;
      
      $("area-select").onchange = () => {
  const value = $("area-select").value;

  const action = value === ALL_AREAS_VALUE
    ? selectAllAreas()
    : selectArea(value);

  action.catch(e => setStatus(e.message, true));
};
      window.addEventListener("resize", () => setTimeout(() => state.map.invalidateSize(), 120));
    }

async function boot() {
  state.viewerConfig = await loadViewerMapConfig();
  initMap();
  bind();
  scheduleSafetyNoteHide();
  updateLocalGpxControls();
  await loadAreas();
}

boot().catch(e => setStatus(e.message, true));
  </script>
</body>
</html>

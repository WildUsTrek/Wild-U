<div id="wildu-wildwall-module" style="padding-bottom: 30px;">
    <div class="card" style="border-left-color: var(--w-gold); margin-top: 20px;">
        <h2 style="color: var(--w-gold); margin-top:0; text-align:center;">🖼️ WildWall</h2>

        <p style="color:#ccc; font-size:14px; line-height:1.5; text-align:center; margin-bottom:18px;">
            Un mosaico vivo delle avventure Wild-U già passate dalla tua bussola.
        </p>

        <div id="wildwall-count" style="color:#777; font-size:11px; font-weight:900; letter-spacing:1px; text-align:center; text-transform:uppercase; margin-bottom:16px;"></div>

        <div id="wildwall-grid" style="
            display:grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap:10px;
        "></div>

        <div id="wildwall-empty" style="display:none; text-align:center; padding:28px 10px;">
            <div style="font-size:46px; margin-bottom:10px;">🌲</div>
            <p style="color:#aaa; font-size:14px; line-height:1.5; margin:0;">
                Nessuna immagine viaggio trovata nella cache.<br>
                Apri qualche avventura e torna qui.
            </p>
        </div>
    </div>
</div>

<script>
(function () {
    console.log("[WILDU WILDWALL] Avvio modulo anti-asset + anti-doppioni");

    const gridEl = document.getElementById("wildwall-grid");
    const emptyEl = document.getElementById("wildwall-empty");
    const countEl = document.getElementById("wildwall-count");

    if (!gridEl || !emptyEl || !countEl) return;

    const PUBLIC_CACHE_KEY = "wildCachePublic";

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function readWildPublicCachePayload() {
        try {
            const raw = localStorage.getItem(PUBLIC_CACHE_KEY);
            if (!raw) return null;

            const envelope = JSON.parse(raw);
            return envelope && envelope.payload ? envelope.payload : null;
        } catch (e) {
            console.warn("[WILDU WILDWALL] Cache pubblica non leggibile:", e);
            return null;
        }
    }

    function fallbackFormatAssetLink(url) {
        if (!url) return "";

        const value = String(url || "").trim();
        if (!value) return "";

        try {
            if (typeof window.formatAssetLink === "function") {
                return window.formatAssetLink(value);
            }
        } catch (e) {}

        if (value.includes("/file/d/")) {
            try {
                return "https://docs.google.com/uc?export=media&id=" +
                    value.split("/file/d/")[1].split("/")[0].split("?")[0];
            } catch (e) {
                return value;
            }
        }

        if (value.includes("id=") && value.includes("drive.google")) {
            try {
                return "https://docs.google.com/uc?export=media&id=" +
                    value.split("id=")[1].split("&")[0];
            } catch (e) {
                return value;
            }
        }

        return value;
    }

    function isUnsafeUrl(rawUrl) {
        const value = String(rawUrl || "").trim().toLowerCase();

        return (
            !value ||
            value.startsWith("javascript:") ||
            value.startsWith("data:") ||
            value.startsWith("blob:") ||
            value.startsWith("mailto:") ||
            value.startsWith("tel:")
        );
    }

    function looksLikeImageUrl(rawUrl) {
        const value = String(rawUrl || "").trim().toLowerCase();
        if (!value) return false;

        return (
            value.includes(".jpg") ||
            value.includes(".jpeg") ||
            value.includes(".png") ||
            value.includes(".webp") ||
            value.includes(".gif") ||
            value.includes("images.unsplash.com") ||
            value.includes("res.cloudinary.com") ||
            value.includes("drive.google.com") ||
            value.includes("docs.google.com/uc") ||
            value.includes("googleusercontent.com")
        );
    }

    function canonicalImageKey(rawUrl) {
        let value = fallbackFormatAssetLink(rawUrl);
        value = String(value || "").trim();

        if (!value) return "";

        try {
            const u = new URL(value, window.location.href);

            const host = u.hostname.toLowerCase().replace(/^www\./, "");
            let path = u.pathname || "";

            // Google Drive già convertito da formatAssetLink: la vera identità è l'id.
            const driveId = u.searchParams.get("id");
            if (driveId && (host.includes("docs.google.com") || host.includes("drive.google.com"))) {
                return "gdrive:" + driveId.trim();
            }

            // Rimuove parametri volatili che creano falsi doppioni.
            [
                "t",
                "time",
                "timestamp",
                "nocache",
                "cache",
                "cachebust",
                "cacheBust",
                "cb",
                "rand",
                "random",
                "shellv",
                "mr",
                "v"
            ].forEach(k => u.searchParams.delete(k));

            // Normalizzazione prudente: host minuscolo, path stabile.
            const query = u.searchParams.toString();
            return host + path + (query ? "?" + query : "");
        } catch (e) {
            return value
                .toLowerCase()
                .replace(/[?&](t|time|timestamp|nocache|cache|cachebust|cb|rand|random|shellv|mr|v)=[^&]+/gi, "")
                .trim();
        }
    }



        function canonicalTitleKey(rawTitle) {
        return String(rawTitle || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, " ")
            .trim();
    }

    function buildForbiddenAssetKeys(cachePayload) {
        const forbidden = new Set();

        function addAssetValue(v) {
            if (!v) return;

            const raw = String(v || "").trim();
            if (!raw) return;

            // Censura solo valori che sembrano davvero immagini/asset visuali.
            // Non vogliamo mischiare link social, WhatsApp, audio, ecc.
            if (!looksLikeImageUrl(raw)) return;

            const key = canonicalImageKey(raw);
            if (key) forbidden.add(key);
        }

        try {
            if (window.WILD_ASSETS && typeof window.WILD_ASSETS === "object") {
                Object.keys(window.WILD_ASSETS).forEach(k => {
                    addAssetValue(window.WILD_ASSETS[k]);
                });
            }
        } catch (e) {}

        try {
            if (cachePayload && cachePayload.assets && typeof cachePayload.assets === "object") {
                Object.keys(cachePayload.assets).forEach(k => {
                    addAssetValue(cachePayload.assets[k]);
                });
            }
        } catch (e) {}

        return forbidden;
    }

    function firstNonEmpty(obj, keys) {
        if (!obj) return "";

        for (let i = 0; i < keys.length; i++) {
            const v = obj[keys[i]];
            if (v !== undefined && v !== null && String(v).trim() !== "") {
                return String(v).trim();
            }
        }

        return "";
    }

    function getRuntimeLists() {
        const trips = Array.isArray(window.allTrips) ? window.allTrips : [];
        const openDays = Array.isArray(window.allOpenDays) ? window.allOpenDays : [];
        const payDays = Array.isArray(window.allPayDays) ? window.allPayDays : [];

        return {
            events: trips,
            opendays: openDays,
            paydays: payDays
        };
    }

    function getCachedLists(cachePayload) {
        return {
            events: Array.isArray(cachePayload && cachePayload.events) ? cachePayload.events : [],
            opendays: Array.isArray(cachePayload && cachePayload.opendays) ? cachePayload.opendays : [],
            paydays: Array.isArray(cachePayload && cachePayload.paydays) ? cachePayload.paydays : []
        };
    }

    function collectTravelImages(sourceName, list, forbiddenAssetKeys, outputMap) {
        if (!Array.isArray(list)) return;

        list.forEach(item => {
            if (!item || typeof item !== "object") return;

            const rawImg = firstNonEmpty(item, [
                "immagine",
                "fotoUrl",
                "img_url",
                "image",
                "Image",
                "Foto",
                "foto",
                "cover",
                "Cover"
            ]);

            if (!rawImg || isUnsafeUrl(rawImg)) return;

            const finalUrl = fallbackFormatAssetLink(rawImg);
            if (!finalUrl || isUnsafeUrl(finalUrl)) return;

            const imageKey = canonicalImageKey(finalUrl);
            if (!imageKey) return;

            // CENSURA ASSOLUTA ASSET:
            // se l'immagine coincide con header, logo, icone o altri asset globali,
            // non entra nel WildWall.
            if (forbiddenAssetKeys.has(imageKey)) return;

            const titolo = firstNonEmpty(item, [
                "Titolo",
                "titolo",
                "title",
                "Nome",
                "nome"
            ]) || "Avventura Wild-U";

            const titleKey = canonicalTitleKey(titolo);
            if (!titleKey) return;

            const regione = firstNonEmpty(item, [
                "Regione",
                "regione",
                "area",
                "Area"
            ]);

            let badge = "VIAGGIO";
            if (sourceName === "opendays") badge = "OPEN DAY";
            if (sourceName === "paydays") badge = "HIKE";

            // ANTI-DOPPIONE PER TITOLO:
            // stesso titolo = una sola card, anche se cambia data.
            // Se ha immagini diverse, ne terremo una random nel render.
            if (!outputMap.has(titleKey)) {
                outputMap.set(titleKey, {
                    titleKey,
                    titolo,
                    candidates: [],
                    imageKeys: new Set()
                });
            }

            const group = outputMap.get(titleKey);

            // Dentro lo stesso titolo evitiamo immagini identiche duplicate.
            if (group.imageKeys.has(imageKey)) return;

            group.imageKeys.add(imageKey);
            group.candidates.push({
                key: imageKey,
                url: finalUrl,
                titolo,
                regione,
                badge
            });
        });
    }

    function shuffleList(list) {
        const copy = Array.isArray(list) ? list.slice() : [];

        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
        }

        return copy;
    }

    function renderWildWall() {
        const cachePayload = readWildPublicCachePayload();
        const forbiddenAssetKeys = buildForbiddenAssetKeys(cachePayload);

        const uniqueTitleGroups = new Map();

        const runtimeLists = getRuntimeLists();
        const cachedLists = getCachedLists(cachePayload);

        // Prima runtime, poi cache: se l'app ha dati freschi, hanno priorità.
        collectTravelImages("events", runtimeLists.events, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("opendays", runtimeLists.opendays, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("paydays", runtimeLists.paydays, forbiddenAssetKeys, uniqueTitleGroups);

        collectTravelImages("events", cachedLists.events, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("opendays", cachedLists.opendays, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("paydays", cachedLists.paydays, forbiddenAssetKeys, uniqueTitleGroups);

        const pickedImages = [];

        uniqueTitleGroups.forEach(group => {
            if (!group || !Array.isArray(group.candidates) || !group.candidates.length) return;

            // Stesso titolo: una sola immagine random.
            const pick = group.candidates[Math.floor(Math.random() * group.candidates.length)];
            pickedImages.push(pick);
        });

        const images = shuffleList(pickedImages);

        if (!images.length) {
            gridEl.innerHTML = "";
            emptyEl.style.display = "block";
            countEl.innerText = "0 immagini viaggio trovate";
            return;
        }

        emptyEl.style.display = "none";
        countEl.innerText = images.length + " avventure uniche";

        gridEl.innerHTML = images.map((img, index) => {
            const safeUrl = escapeHtml(img.url);
            const safeTitle = escapeHtml(img.titolo);
            const safeRegione = escapeHtml(img.regione);
            const safeBadge = escapeHtml(img.badge);

            const tall = index % 5 === 0;
            const height = tall ? "214px" : "158px";

            return `
                <div style="
                    position:relative;
                    overflow:hidden;
                    border-radius:14px;
                    height:${height};
                    background:#111;
                    border:1px solid rgba(255,255,255,0.08);
                    box-shadow:0 5px 16px rgba(0,0,0,0.35);
                ">
                    <div style="
                        position:absolute;
                        inset:-18px;
                        background-image:url('${safeUrl}');
                        background-size:cover;
                        background-position:center;
                        filter:blur(18px);
                        transform:scale(1.08);
                        opacity:0.45;
                    "></div>

                    <img
                        src="${safeUrl}"
                        alt="${safeTitle}"
                        loading="lazy"
                        style="
                            position:relative;
                            z-index:1;
                            width:100%;
                            height:100%;
                            object-fit:contain;
                            object-position:center;
                            display:block;
                            padding:6px;
                            filter:saturate(1.08) contrast(1.03);
                        "
                    >

                    <div style="
                        position:absolute;
                        inset:0;
                        z-index:2;
                        background:
                            linear-gradient(180deg, rgba(0,0,0,0.03) 20%, rgba(0,0,0,0.84) 100%),
                            radial-gradient(circle at center, transparent 42%, rgba(0,0,0,0.22));
                        pointer-events:none;
                    "></div>

                    <div style="
                        position:absolute;
                        z-index:3;
                        top:8px;
                        left:8px;
                        background:rgba(0,0,0,0.65);
                        border:1px solid rgba(212,175,55,0.55);
                        color:var(--w-gold);
                        border-radius:999px;
                        padding:4px 8px;
                        font-size:9px;
                        font-weight:900;
                        letter-spacing:0.7px;
                        text-transform:uppercase;
                    ">${safeBadge}</div>

                    <div style="
                        position:absolute;
                        z-index:3;
                        left:10px;
                        right:10px;
                        bottom:10px;
                        text-align:left;
                    ">
                        <div style="
                            color:#fff;
                            font-size:12px;
                            font-weight:900;
                            line-height:1.15;
                            text-transform:uppercase;
                            text-shadow:0 2px 8px rgba(0,0,0,0.9);
                            display:-webkit-box;
                            -webkit-line-clamp:2;
                            -webkit-box-orient:vertical;
                            overflow:hidden;
                        ">${safeTitle}</div>

                        <div style="
                            margin-top:4px;
                            color:#ccc;
                            font-size:10px;
                            font-weight:700;
                            line-height:1.2;
                            text-shadow:0 2px 8px rgba(0,0,0,0.9);
                            white-space:nowrap;
                            overflow:hidden;
                            text-overflow:ellipsis;
                        ">
                            ${safeRegione ? "📍 " + safeRegione : "Avventura Wild-U"}
                        </div>
                    </div>
                </div>
            `;
        }).join("");

        console.log("[WILDU WILDWALL] Render completato", {
            avventureUnichePerTitolo: images.length,
            gruppiTitoloTotali: uniqueTitleGroups.size,
            assetCensuratiPotenziali: forbiddenAssetKeys.size
        });
    }

    renderWildWall();
})();
</script>

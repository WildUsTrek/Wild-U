<div id="wildu-sassi-fullscreen" aria-hidden="true" style="
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: none;
    background: #050505;
    z-index: 30000;
    overflow: hidden;
">
    <button id="wildu-close-sassi-fullscreen" type="button" aria-label="Chiudi gioco" style="
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: calc(14px + env(safe-area-inset-right, 0px));
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.78);
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 8px 26px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        z-index: 30002;
    ">×</button>

<div id="wildu-sassi-frame-shell" style="
        position: absolute;
        inset: 0;
        padding-top: calc(70px + env(safe-area-inset-top, 0px));
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        box-sizing: border-box;
        background: #000;
    ">
        <iframe
            id="wildu-sassi-frame"
            title="Sfida dei Sassi"
            src="about:blank"
            allow="fullscreen; autoplay; gamepad"
            allowfullscreen
            style="
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
                background: #000;
            "
        ></iframe>
    </div>
</div>
</div>
<script>
(function () {
    console.log("[WILDU GIOCHI] Modulo giochi avviato con Sassi fullscreen");

    const GAME_PATHS = {
        sassi: "giochi/sfida-dei-sassi/index.html"
    };

    const menu = document.getElementById("wildu-games-menu");
    const rifugio = document.getElementById("wildu-game-rifugio");

    const openRifugioBtn = document.getElementById("wildu-open-rifugio");
    const openSassiBtn = document.getElementById("wildu-open-sassi");
    const buildBtn = document.getElementById("wildu-build-rifugio");
    const rifugioResult = document.getElementById("wildu-rifugio-result");

    const sassiOverlay = document.getElementById("wildu-sassi-fullscreen");
    const sassiFrame = document.getElementById("wildu-sassi-frame");
    const closeSassiBtn = document.getElementById("wildu-close-sassi-fullscreen");

    let previousBodyOverflow = "";
    let previousHtmlOverflow = "";

    function resolveWilduGameUrl(rawUrl) {
        const clean = String(rawUrl || "").trim();
        if (!clean) return "";

        try {
            if (
                window.WILDU_MODULE &&
                typeof window.WILDU_MODULE.getUrl === "function"
            ) {
                return window.WILDU_MODULE.getUrl(clean);
            }
        } catch (e) {}

        try {
            if (typeof window.getVersionedModuleUrl === "function") {
                return window.getVersionedModuleUrl(clean);
            }
        } catch (e) {}

        return clean;
    }

    function getSassiGameUrl() {
        return resolveWilduGameUrl(GAME_PATHS.sassi);
    }

    function showGame(which) {
        if (!menu || !rifugio) return;

        menu.style.display = which === "menu" ? "block" : "none";
        rifugio.style.display = which === "rifugio" ? "block" : "none";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function openSassiFullscreen() {
        if (!sassiOverlay || !sassiFrame) {
            console.warn("[WILDU GIOCHI] Overlay Sassi non trovato");
            return;
        }

        const targetUrl = getSassiGameUrl();
        if (!targetUrl) {
            console.warn("[WILDU GIOCHI] URL gioco Sassi non valido");
            return;
        }

        previousBodyOverflow = document.body.style.overflow || "";
        previousHtmlOverflow = document.documentElement.style.overflow || "";

        document.body.style.overflow = "hidden";
        document.documentElement.style.overflow = "hidden";

        sassiOverlay.style.display = "block";
        sassiOverlay.setAttribute("aria-hidden", "false");

        sassiFrame.setAttribute("src", targetUrl);

        try {
            sassiFrame.focus();
        } catch (e) {}

        console.log("[WILDU GIOCHI] Sfida dei Sassi aperta fullscreen", {
            url: targetUrl
        });
    }

    function closeSassiFullscreen() {
        if (!sassiOverlay || !sassiFrame) return;

        sassiOverlay.style.display = "none";
        sassiOverlay.setAttribute("aria-hidden", "true");

        /*
            Importante:
            about:blank scarica il gioco e ferma loop, audio, canvas e timer.
            Così non resta niente attivo sotto l'Hub.
        */
        sassiFrame.setAttribute("src", "about:blank");

        document.body.style.overflow = previousBodyOverflow;
        document.documentElement.style.overflow = previousHtmlOverflow;

        console.log("[WILDU GIOCHI] Sfida dei Sassi chiusa");
    }

    if (openRifugioBtn) {
        openRifugioBtn.addEventListener("click", function () {
            showGame("rifugio");
        });
    }

    if (openSassiBtn) {
        openSassiBtn.addEventListener("click", function () {
            openSassiFullscreen();
        });
    }

    if (closeSassiBtn) {
        closeSassiBtn.addEventListener("click", function () {
            closeSassiFullscreen();
        });
    }

    document.addEventListener("keydown", function (e) {
        if (
            e.key === "Escape" &&
            sassiOverlay &&
            sassiOverlay.style.display !== "none"
        ) {
            closeSassiFullscreen();
        }
    });

    document.querySelectorAll(".wildu-games-menu-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
            showGame("menu");
        });
    });

    if (buildBtn && rifugioResult) {
        buildBtn.addEventListener("click", function () {
            const rifugi = [
                {
                    icon: "🏕️",
                    title: "Rifugio del Bosco",
                    text: "Solido, semplice, profuma di resina. Gli spiriti approvano."
                },
                {
                    icon: "🔥",
                    title: "Bivacco del Fuoco Gentile",
                    text: "Piccolo ma caldo. Perfetto per raccontare storie dopo il sentiero."
                },
                {
                    icon: "🌙",
                    title: "Capanna della Luna",
                    text: "Misteriosa e silenziosa. Si vede solo agli esploratori pazienti."
                },
                {
                    icon: "⛰️",
                    title: "Rifugio di Cresta",
                    text: "Esposto al vento, ma con vista divina. Roba da veterani."
                }
            ];

            const pick = rifugi[Math.floor(Math.random() * rifugi.length)];

            rifugioResult.style.display = "block";
            rifugioResult.innerHTML = `
                <div style="font-size:48px; margin-bottom:10px;">${pick.icon}</div>
                <div style="color:var(--w-gold); font-size:20px; font-weight:900; text-transform:uppercase; margin-bottom:8px;">${pick.title}</div>
                <div style="color:#ddd; font-size:14px; line-height:1.5;">${pick.text}</div>
            `;
        });
    }
})();
</script>

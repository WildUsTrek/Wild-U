<div id="wildu-radio-module" style="padding-bottom:30px;">
    <section
        style="
            position:relative;
            overflow:hidden;
            margin:18px 0 20px 0;
            padding:24px 20px;
            border-radius:22px;
            border:1px solid rgba(124,199,255,.24);
            background:
                radial-gradient(circle at top left, rgba(124,199,255,.22), transparent 42%),
                radial-gradient(circle at bottom right, rgba(45,90,39,.30), transparent 46%),
                linear-gradient(135deg, rgba(8,14,20,.96), rgba(18,18,18,.98));
            box-shadow:0 16px 42px rgba(0,0,0,.48);
            box-sizing:border-box;
        "
    >
        <div
            style="
                position:absolute;
                right:-38px;
                top:-42px;
                width:132px;
                height:132px;
                border-radius:999px;
                background:rgba(124,199,255,.09);
                border:1px solid rgba(124,199,255,.18);
                pointer-events:none;
            "
        ></div>

        <div style="position:relative; z-index:1;">
            <div
                style="
                    display:inline-flex;
                    align-items:center;
                    gap:8px;
                    padding:7px 11px;
                    border-radius:999px;
                    background:rgba(124,199,255,.11);
                    color:#7cc7ff;
                    font-size:11px;
                    font-weight:900;
                    letter-spacing:.9px;
                    text-transform:uppercase;
                    border:1px solid rgba(124,199,255,.22);
                    margin-bottom:14px;
                "
            >
                <span>📻</span>
                <span>Wild-U Sound</span>
            </div>

            <h2
                style="
                    color:#fff;
                    margin:0;
                    font-size:28px;
                    line-height:1.05;
                    font-weight:950;
                    text-transform:uppercase;
                    letter-spacing:.6px;
                "
            >
                Radio Natura
            </h2>

            <p
                style="
                    color:#b9c4c9;
                    font-size:14px;
                    line-height:1.5;
                    margin:12px 0 0 0;
                    max-width:560px;
                "
            >
                Puntate, racconti e canzoni Wild-U caricati dalla Media Suite.
            </p>
        </div>
    </section>

    <div id="wildu-radio-list"></div>
</div>

<script>
(function () {
    console.log("[WILDU MEDIA RADIO] Modulo avviato");

    if (!window.WilduMediaClient || typeof window.WilduMediaClient.renderTag !== "function") {
        const root = document.getElementById("wildu-radio-list");
        if (root) {
            root.innerHTML = `
                <div class="card" style="border-left-color:#ff4444; text-align:center;">
                    <div style="font-size:42px; margin-bottom:10px;">⚠️</div>
                    <h3 style="color:#ff6666; margin:0 0 8px 0;">Loader media assente</h3>
                    <p style="color:#aaa; font-size:14px; line-height:1.5; margin:0;">
                        La client app deve essere aggiornata con WilduMediaClient.
                    </p>
                </div>
            `;
        }
        return;
    }

    window.WilduMediaClient.renderTag({
        tagSlug: "radio",
        category: "audio",
        mount: "#wildu-radio-list",
        renderer: "audio-list"
    });

    if (window.WILDU_MODULE && typeof window.WILDU_MODULE.rewriteRoot === "function") {
        window.WILDU_MODULE.rewriteRoot(document.getElementById("wildu-radio-module"));
    }
})();
</script>

<div id="wildu-radio-module" style="padding-bottom:30px;">
<style id="wildu-radio-desktop-polish-v2">
/* WILDU RADIO — desktop polish V2.
   Mobile untouched. No JS/renderTag/cache changes.
   V2 fix: no aggressive card margin reset; spacing is guaranteed even when
   the client renderer adds wrappers or panels with unexpected structure. */
@media (min-width: 900px) {
    #wildu-radio-module {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto;
        padding-bottom: 46px !important;
    }

    #wildu-radio-module > section:first-of-type {
        margin-top: 20px !important;
        margin-bottom: 24px !important;
        padding: 28px 30px !important;
        border-radius: 30px !important;
        box-shadow: 0 20px 56px rgba(0,0,0,.55) !important;
    }

    #wildu-radio-module > section:first-of-type h2 {
        font-size: clamp(30px, 3vw, 42px) !important;
        line-height: .98 !important;
    }

    #wildu-radio-module > section:first-of-type p {
        max-width: 760px !important;
        font-size: 15px !important;
        line-height: 1.55 !important;
    }

    #wildu-radio-list {
        min-width: 0;
    }

    /* Tab Radio: stesso markup, più ordinato su desktop. */
    #wildu-radio-list > div:first-child {
        max-width: 560px;
        margin-left: auto !important;
        margin-right: auto !important;
        margin-bottom: 22px !important;
    }

    /* Pannelli generati dal renderer: se sono visibili diventano griglia.
       Se il renderer usa display:none inline, questo CSS non lo forza aperto. */
    #wildu-radio-list [data-wildu-radio-panel] {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 18px;
        align-items: stretch;
    }

    #wildu-radio-list [data-wildu-radio-panel]:not([style*="display:none"]):not([style*="display: none"]) {
        display: grid;
    }

    /* Spaziatura difensiva: se la griglia non intercetta il wrapper reale,
       le card mantengono comunque aria e non restano appiccicate. */
    #wildu-radio-list .card {
        min-width: 0;
        box-sizing: border-box;
        margin-bottom: 18px;
    }

    /* Solo quando la card è figlia diretta di un pannello reso a griglia,
       il gap della griglia basta e il margin può sparire senza rischi. */
    #wildu-radio-list [data-wildu-radio-panel]:not([style*="display:none"]):not([style*="display: none"]) > .card {
        margin-bottom: 0;
        height: 100%;
    }

    /* Fallback per renderer che inseriscono wrapper fra pannello e card. */
    #wildu-radio-list [data-wildu-radio-panel]:not([style*="display:none"]):not([style*="display: none"]) > * {
        min-width: 0;
    }

    #wildu-radio-list audio {
        max-width: 100%;
    }
}
</style>

<script>
(function () {
    console.log("[WILDU MEDIA RADIO] Modulo avviato");

    if (!window.WilduMediaClient || typeof window.WilduMediaClient.renderTag !== "function") {
        const root = document.getElementById("wildu-radio-list");
        if (root) {
            root.innerHTML = `
                <div class="card" style="border-left-color:#ff4444; text-align:center;">
                    <div style="font-size:42px; margin-bottom:10px;">⚠️</div>
                    <h3 style="color:#ff6666; margin:0 0 8px 0;">Loader media assente</h3>
                    <p style="color:#aaa; font-size:14px; line-height:1.5; margin:0;">
                        La client app deve essere aggiornata con WilduMediaClient.
                    </p>
                </div>
            `;
        }
        return;
    }

    window.WilduMediaClient.renderTag({
        tagSlug: "radio",
        category: "audio",
        mount: "#wildu-radio-list",
        renderer: "audio-list"
    });

    if (window.WILDU_MODULE && typeof window.WILDU_MODULE.rewriteRoot === "function") {
        window.WILDU_MODULE.rewriteRoot(document.getElementById("wildu-radio-module"));
    }
})();
</script>

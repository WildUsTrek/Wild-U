<script>
(function () {
    console.log("[WILDU WILDWALL] Modulo premium Shorts + foto pulite avviato");

    const root = document.getElementById("wildu-wildwall-module");
    const gridEl = document.getElementById("wildwall-grid");
    const emptyEl = document.getElementById("wildwall-empty");
    const countEl = document.getElementById("wildwall-count");
    const previewWrap = document.getElementById("wildwall-preview-wrap");
    const previewRail = document.getElementById("wildwall-preview-rail");
    const shortsSection = document.getElementById("wildwall-shorts-section");

    if (!root || !gridEl || !emptyEl || !countEl) return;

    const PUBLIC_CACHE_KEY = "wildCachePublic";
    const SHORTS_PLAYLIST_ID = "PLrxqst5TP2nI3GGeSe44lnLnCA_0US2hh";

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function readWildPublicCachePayload() {
        try {
            const raw = localStorage.getItem(PUBLIC_CACHE_KEY);
            if (!raw) return null;

            const envelope = JSON.parse(raw);
            return envelope && envelope.payload ? envelope.payload : null;
        } catch (e) {
            console.warn("[WILDU WILDWALL] Cache pubblica non leggibile:", e);
            return null;
        }
    }

    function fallbackFormatAssetLink(url) {
        if (!url) return "";

        const value = String(url || "").trim();
        if (!value) return "";

        try {
            if (typeof window.formatAssetLink === "function") {
                return window.formatAssetLink(value);
            }
        } catch (e) {}

        if (value.includes("/file/d/")) {
            try {
                return "https://docs.google.com/uc?export=media&id=" +
                    value.split("/file/d/")[1].split("/")[0].split("?")[0];
            } catch (e) {
                return value;
            }
        }

        if (value.includes("id=") && value.includes("drive.google")) {
            try {
                return "https://docs.google.com/uc?export=media&id=" +
                    value.split("id=")[1].split("&")[0];
            } catch (e) {
                return value;
            }
        }

        return value;
    }

    function isUnsafeUrl(rawUrl) {
        const value = String(rawUrl || "").trim().toLowerCase();

        return (
            !value ||
            value.startsWith("javascript:") ||
            value.startsWith("data:") ||
            value.startsWith("blob:") ||
            value.startsWith("mailto:") ||
            value.startsWith("tel:")
        );
    }

    function looksLikeImageUrl(rawUrl) {
        const value = String(rawUrl || "").trim().toLowerCase();
        if (!value) return false;

        return (
            value.includes(".jpg") ||
            value.includes(".jpeg") ||
            value.includes(".png") ||
            value.includes(".webp") ||
            value.includes(".gif") ||
            value.includes("images.unsplash.com") ||
            value.includes("res.cloudinary.com") ||
            value.includes("drive.google.com") ||
            value.includes("docs.google.com/uc") ||
            value.includes("googleusercontent.com")
        );
    }

    function canonicalImageKey(rawUrl) {
        let value = fallbackFormatAssetLink(rawUrl);
        value = String(value || "").trim();

        if (!value) return "";

        try {
            const u = new URL(value, window.location.href);
            const host = u.hostname.toLowerCase().replace(/^www\./, "");
            const path = u.pathname || "";

            const driveId = u.searchParams.get("id");
            if (driveId && (host.includes("docs.google.com") || host.includes("drive.google.com"))) {
                return "gdrive:" + driveId.trim();
            }

            [
                "t", "time", "timestamp", "nocache", "cache", "cachebust", "cacheBust",
                "cb", "rand", "random", "shellv", "mr", "v"
            ].forEach(function (k) { u.searchParams.delete(k); });

            const query = u.searchParams.toString();
            return host + path + (query ? "?" + query : "");
        } catch (e) {
            return value
                .toLowerCase()
                .replace(/[?&](t|time|timestamp|nocache|cache|cachebust|cb|rand|random|shellv|mr|v)=[^&]+/gi, "")
                .trim();
        }
    }

    function canonicalTitleKey(rawTitle) {
        return String(rawTitle || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, " ")
            .trim();
    }

    function buildForbiddenAssetKeys(cachePayload) {
        const forbidden = new Set();

        function addAssetValue(v) {
            if (!v) return;

            const raw = String(v || "").trim();
            if (!raw) return;
            if (!looksLikeImageUrl(raw)) return;

            const key = canonicalImageKey(raw);
            if (key) forbidden.add(key);
        }

        try {
            if (window.WILD_ASSETS && typeof window.WILD_ASSETS === "object") {
                Object.keys(window.WILD_ASSETS).forEach(function (k) {
                    addAssetValue(window.WILD_ASSETS[k]);
                });
            }
        } catch (e) {}

        try {
            if (cachePayload && cachePayload.assets && typeof cachePayload.assets === "object") {
                Object.keys(cachePayload.assets).forEach(function (k) {
                    addAssetValue(cachePayload.assets[k]);
                });
            }
        } catch (e) {}

        return forbidden;
    }

    function firstNonEmpty(obj, keys) {
        if (!obj) return "";

        for (let i = 0; i < keys.length; i++) {
            const v = obj[keys[i]];
            if (v !== undefined && v !== null && String(v).trim() !== "") {
                return String(v).trim();
            }
        }

        return "";
    }

    function getRuntimeLists() {
        const trips = Array.isArray(window.allTrips) ? window.allTrips : [];
        const openDays = Array.isArray(window.allOpenDays) ? window.allOpenDays : [];
        const payDays = Array.isArray(window.allPayDays) ? window.allPayDays : [];

        return {
            events: trips,
            opendays: openDays,
            paydays: payDays
        };
    }

    function getCachedLists(cachePayload) {
        return {
            events: Array.isArray(cachePayload && cachePayload.events) ? cachePayload.events : [],
            opendays: Array.isArray(cachePayload && cachePayload.opendays) ? cachePayload.opendays : [],
            paydays: Array.isArray(cachePayload && cachePayload.paydays) ? cachePayload.paydays : []
        };
    }

    function collectTravelImages(sourceName, list, forbiddenAssetKeys, outputMap) {
        if (!Array.isArray(list)) return;

        list.forEach(function (item) {
            if (!item || typeof item !== "object") return;

            const rawImg = firstNonEmpty(item, [
                "immagine",
                "fotoUrl",
                "img_url",
                "image",
                "Image",
                "Foto",
                "foto",
                "cover",
                "Cover"
            ]);

            if (!rawImg || isUnsafeUrl(rawImg)) return;

            const finalUrl = fallbackFormatAssetLink(rawImg);
            if (!finalUrl || isUnsafeUrl(finalUrl)) return;

            const imageKey = canonicalImageKey(finalUrl);
            if (!imageKey) return;
            if (forbiddenAssetKeys.has(imageKey)) return;

            const titolo = firstNonEmpty(item, [
                "Titolo",
                "titolo",
                "title",
                "Nome",
                "nome"
            ]) || "Avventura Wild-U";

            const titleKey = canonicalTitleKey(titolo);
            if (!titleKey) return;

            const regione = firstNonEmpty(item, [
                "Regione",
                "regione",
                "area",
                "Area"
            ]);

            let badge = "VIAGGIO";
            if (sourceName === "opendays") badge = "OPEN DAY";
            if (sourceName === "paydays") badge = "HIKE";

            if (!outputMap.has(titleKey)) {
                outputMap.set(titleKey, {
                    titleKey: titleKey,
                    titolo: titolo,
                    candidates: [],
                    imageKeys: new Set()
                });
            }

            const group = outputMap.get(titleKey);
            if (group.imageKeys.has(imageKey)) return;

            group.imageKeys.add(imageKey);
            group.candidates.push({
                key: imageKey,
                url: finalUrl,
                titolo: titolo,
                regione: regione,
                badge: badge
            });
        });
    }

    function shuffleList(list) {
        const copy = Array.isArray(list) ? list.slice() : [];

        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
        }

        return copy;
    }

    function collectWildwallImages() {
        const cachePayload = readWildPublicCachePayload();
        const forbiddenAssetKeys = buildForbiddenAssetKeys(cachePayload);
        const uniqueTitleGroups = new Map();

        const runtimeLists = getRuntimeLists();
        const cachedLists = getCachedLists(cachePayload);

        collectTravelImages("events", runtimeLists.events, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("opendays", runtimeLists.opendays, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("paydays", runtimeLists.paydays, forbiddenAssetKeys, uniqueTitleGroups);

        collectTravelImages("events", cachedLists.events, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("opendays", cachedLists.opendays, forbiddenAssetKeys, uniqueTitleGroups);
        collectTravelImages("paydays", cachedLists.paydays, forbiddenAssetKeys, uniqueTitleGroups);

        const pickedImages = [];

        uniqueTitleGroups.forEach(function (group) {
            if (!group || !Array.isArray(group.candidates) || !group.candidates.length) return;
            const pick = group.candidates[Math.floor(Math.random() * group.candidates.length)];
            pickedImages.push(pick);
        });

        return {
            images: shuffleList(pickedImages),
            groupsCount: uniqueTitleGroups.size,
            forbiddenCount: forbiddenAssetKeys.size
        };
    }

    let wildwallRenderedImages = [];

    function getWildwallPopupEls() {
        return {
            overlay: document.getElementById("wildwall-photo-overlay"),
            closeBtn: document.getElementById("wildwall-photo-close"),
            bigImg: document.getElementById("wildwall-photo-big"),
            caption: document.getElementById("wildwall-photo-caption"),
            meta: document.getElementById("wildwall-photo-meta")
        };
    }

    function openWildwallPhoto(index) {
        const img = wildwallRenderedImages[index];
        if (!img) return;

        const els = getWildwallPopupEls();
        if (!els.overlay || !els.bigImg || !els.caption || !els.meta) return;

        els.bigImg.src = img.url || "";
        els.bigImg.alt = img.titolo || "Foto Wild-U";
        els.caption.innerText = img.titolo || "Avventura Wild-U";

        const metaParts = [];
        if (img.badge) metaParts.push(img.badge);
        if (img.regione) metaParts.push("📍 " + img.regione);

        els.meta.innerText = metaParts.join(" · ");
        els.overlay.style.display = "flex";
        document.body.style.overflow = "hidden";
        document.documentElement.style.overflow = "hidden";
    }

    function closeWildwallPhoto() {
        const els = getWildwallPopupEls();
        if (!els.overlay || !els.bigImg) return;

        els.overlay.style.display = "none";
        els.bigImg.src = "";
        document.body.style.overflow = "";
        document.documentElement.style.overflow = "";
    }

    function bindWildwallPopupEvents() {
        const els = getWildwallPopupEls();
        if (!els.overlay || els.overlay.dataset.bound === "1") return;

        els.overlay.dataset.bound = "1";

        els.overlay.addEventListener("click", function (e) {
            if (e.target === els.overlay) closeWildwallPhoto();
        });

        if (els.closeBtn) {
            els.closeBtn.addEventListener("click", closeWildwallPhoto);
        }

        if (!window.__wildwallEscBound) {
            window.__wildwallEscBound = true;

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    const nowEls = getWildwallPopupEls();
                    if (nowEls.overlay && nowEls.overlay.style.display !== "none") {
                        closeWildwallPhoto();
                    }
                }
            });
        }
    }

    function bindWildwallPhotoClicks() {
        root.querySelectorAll("[data-wildwall-index]").forEach(function (card) {
            if (card.dataset.bound === "1") return;
            card.dataset.bound = "1";

            card.addEventListener("click", function () {
                const index = parseInt(card.getAttribute("data-wildwall-index"), 10);
                openWildwallPhoto(index);
            });
        });
    }

    function renderWildwallPreview(images) {
        if (!previewWrap || !previewRail) return;

        if (!Array.isArray(images) || !images.length) {
            previewWrap.style.display = "none";
            previewRail.innerHTML = "";
            return;
        }

        previewWrap.style.display = "block";
        previewRail.innerHTML = images.map(function (img, index) {
            const safeUrl = escapeHtml(img.url);
            const safeTitle = escapeHtml(img.titolo);

            return `
                <button
                    type="button"
                    class="wildwall-preview-thumb"
                    data-wildwall-index="${index}"
                    aria-label="Apri foto ${safeTitle}"
                >
                    <img src="${safeUrl}" alt="${safeTitle}" loading="lazy">
                </button>
            `;
        }).join("");
    }

    function renderWildwallGrid(images) {
        gridEl.innerHTML = images.map(function (img, index) {
            const safeUrl = escapeHtml(img.url);
            const safeTitle = escapeHtml(img.titolo);

            return `
                <button
                    type="button"
                    class="wildwall-photo-card"
                    data-wildwall-index="${index}"
                    aria-label="Apri foto ${safeTitle}"
                >
                    <img src="${safeUrl}" alt="${safeTitle}" loading="lazy">
                </button>
            `;
        }).join("");
    }

    function renderShortsBlock() {
        if (!shortsSection) return;

        if (!SHORTS_PLAYLIST_ID) {
            shortsSection.style.display = "none";
            return;
        }

        shortsSection.style.display = "block";
    }

    function renderWildWall() {
        renderShortsBlock();

        const result = collectWildwallImages();
        const images = result.images || [];

        if (!images.length) {
            wildwallRenderedImages = [];
            gridEl.innerHTML = "";
            renderWildwallPreview([]);
            emptyEl.style.display = "block";
            countEl.innerText = "0 immagini viaggio trovate";
            return;
        }

        wildwallRenderedImages = images;
        emptyEl.style.display = "none";
        countEl.innerText = images.length + " avventure uniche";

        renderWildwallPreview(images);
        renderWildwallGrid(images);
        bindWildwallPopupEvents();
        bindWildwallPhotoClicks();

        console.log("[WILDU WILDWALL] Render premium completato", {
            avventureUnichePerTitolo: images.length,
            gruppiTitoloTotali: result.groupsCount,
            assetCensuratiPotenziali: result.forbiddenCount,
            shortsPlaylist: SHORTS_PLAYLIST_ID
        });
    }

    renderWildWall();

    if (window.WILDU_MODULE && typeof window.WILDU_MODULE.rewriteRoot === "function") {
        try { window.WILDU_MODULE.rewriteRoot(root); } catch (e) {}
    }
})();
</script>

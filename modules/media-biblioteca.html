<div id="wildu-biblioteca-module" style="padding-bottom:30px;">
<style id="wildu-biblioteca-desktop-polish-v2">
/* WILDU BIBLIOTECA — desktop polish V2.
   Mobile untouched. No JS/renderTag/cache changes.
   V2 fix: no aggressive card margin reset; spacing is guaranteed even when
   the client renderer adds wrappers or panels with unexpected slugs. */
@media (min-width: 900px) {
    #wildu-biblioteca-module {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto;
        padding-bottom: 46px !important;
    }

    #wildu-biblioteca-module > div:first-of-type {
        margin-top: 12px !important;
        margin-bottom: 18px !important;
        padding: 18px 20px !important;
        border-radius: 22px !important;
        box-shadow: 0 14px 40px rgba(0,0,0,.52) !important;
    }

    #wildu-biblioteca-module > div:first-of-type h2 {
        font-size: clamp(24px, 2.2vw, 32px) !important;
        line-height: 1.04 !important;
        max-width: 650px;
    }

    #wildu-biblioteca-module > div:first-of-type p {
        max-width: 540px !important;
        font-size: 14px !important;
        line-height: 1.45 !important;
    }

    #wildu-biblioteca-list {
        min-width: 0;
    }

    /* Tab Biblioteca: più leggibili su desktop, ma stesso funzionamento. */
    #wildu-biblioteca-list > div:first-child {
        max-width: 720px;
        margin-left: auto !important;
        margin-right: auto !important;
        margin-bottom: 22px !important;
    }

    /* Pannelli generati dal renderer: se sono visibili diventano griglia.
       Se il renderer usa display:none inline, questo CSS non lo forza aperto. */
    #wildu-biblioteca-list [data-wildu-media-panel] {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
        gap: 18px;
        align-items: stretch;
    }

    #wildu-biblioteca-list [data-wildu-media-panel]:not([style*="display:none"]):not([style*="display: none"]) {
        display: grid;
    }

    /* Spaziatura difensiva: se la griglia non intercetta il wrapper reale,
       le card mantengono comunque aria e non restano appiccicate. */
    #wildu-biblioteca-list .card {
        min-width: 0;
        box-sizing: border-box;
        margin-bottom: 18px;
    }

    /* Solo quando la card è figlia diretta di un pannello reso a griglia,
       il gap della griglia basta e il margin può sparire senza rischi. */
    #wildu-biblioteca-list [data-wildu-media-panel]:not([style*="display:none"]):not([style*="display: none"]) > .card {
        margin-bottom: 0;
        height: 100%;
    }

    /* Fallback per renderer che inseriscono wrapper fra pannello e card. */
    #wildu-biblioteca-list [data-wildu-media-panel]:not([style*="display:none"]):not([style*="display: none"]) > * {
        min-width: 0;
    }

    /* News resta editoriale: non la forziamo in griglia. */
    #wildu-biblioteca-list [data-wildu-media-panel="news"] > .card,
    #wildu-news-horizontal-video-card {
        max-width: 940px;
        margin-left: auto !important;
        margin-right: auto !important;
        margin-bottom: 22px !important;
    }
}
</style>

    <div style="
        margin-top:12px;
        margin-bottom:14px;
        padding:14px 14px;
        border-radius:18px;
        background:
            radial-gradient(circle at top left, rgba(212,175,55,.26), transparent 43%),
            radial-gradient(circle at bottom right, rgba(124,199,255,.15), transparent 38%),
            linear-gradient(135deg, rgba(34,38,30,.98), rgba(10,13,15,.98));

    ">

        ">📚</div>

<script>
(function () {
    console.log("[WILDU MEDIA BIBLIOTECA] Modulo avviato");

    if (!window.WilduMediaClient || typeof window.WilduMediaClient.renderTag !== "function") {
        const root = document.getElementById("wildu-biblioteca-list");
        if (root) {
            root.innerHTML = `
                <div class="card" style="border-left-color:#ff4444; text-align:center;">
                    <div style="font-size:42px; margin-bottom:10px;">⚠️</div>
                    <h3 style="color:#ff6666; margin:0 0 8px 0;">Loader media assente</h3>
                    <p style="color:#aaa; font-size:14px; line-height:1.5; margin:0;">
                        La client app deve essere aggiornata con WilduMediaClient.
                    </p>
                </div>
            `;
        }
        return;
    }

    window.WilduMediaClient.renderTag({
        tagSlug: "biblioteca",
        mount: "#wildu-biblioteca-list",
        renderer: "biblioteca-tabs"
    });

    // =========================================================
    // WILDU NEWS VIDEO — playlist orizzontale da manifest GitHub
    // =========================================================
    // Patch prudente:
    // - non tocca WilduMediaClient/renderTag;
    // - non cambia il renderer biblioteca-tabs;
    // - legge solo data/youtube-playlists.json;
    // - prova ad agganciarsi sotto "Articolo consigliato" nella tab News;
    // - fallback sicuro: fondo del modulo Biblioteca.
    // Nessun link esterno alla playlist, nessuna YouTube API.
    var WILDU_HORIZONTAL_VIDEO_STATE = {
        mounted: false,
        manifestPromise: null,
        observer: null,
        lastRenderAt: 0,
        selectedVideo: null,
        selectedPlaylist: null,
        renderTimer: null,
        initialFollowupTimer: null,
        rendering: false
    };

    function wilduVideoEscape(value) {
        return String(value === undefined || value === null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function wilduWithQueryParam(url, key, value) {
        try {
            var parsed = new URL(url, window.location.href);
            parsed.searchParams.set(key, value);
            return parsed.toString();
        } catch (e) {
            var join = String(url || "").indexOf("?") === -1 ? "?" : "&";
            return String(url || "") + join + encodeURIComponent(key) + "=" + encodeURIComponent(value);
        }
    }

    function wilduYoutubeConfigCandidates() {
        var explicit = window.WILDU_YOUTUBE_PLAYLISTS_CONFIG_URL || "";
        var list = [];

        if (explicit) list.push(explicit);
        list.push("data/youtube-playlists-config.json");
        list.push("/Wild-U/data/youtube-playlists-config.json");

        return list.filter(function (url, index, arr) {
            return url && arr.indexOf(url) === index;
        });
    }

    function wilduYoutubeManifestCandidates(manifestVersion) {
        var explicit = window.WILDU_YOUTUBE_PLAYLISTS_URL ||
            window.WILDU_YT_PLAYLISTS_URL ||
            "";

        var version = manifestVersion ? String(manifestVersion) : String(Math.floor(Date.now() / 86400000));
        var list = [];

        if (explicit) list.push(explicit);
        list.push("data/youtube-playlists.json");
        list.push("/Wild-U/data/youtube-playlists.json");

        return list
            .filter(function (url, index, arr) {
                return url && arr.indexOf(url) === index;
            })
            .map(function (url) {
                return wilduWithQueryParam(url, "v", version);
            });
    }

    async function wilduFetchYoutubeConfig() {
        var candidates = wilduYoutubeConfigCandidates();
        var lastError = null;

        for (var i = 0; i < candidates.length; i++) {
            try {
                var freshUrl = wilduWithQueryParam(candidates[i], "cfgts", String(Date.now()));
                var res = await fetch(freshUrl, { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                return await res.json();
            } catch (err) {
                lastError = err;
            }
        }

        console.warn("[WILDU MEDIA BIBLIOTECA] Config YouTube non disponibile, uso fallback manifest diretto:", lastError);
        return null;
    }

    async function wilduFetchYoutubeManifest() {
        if (WILDU_HORIZONTAL_VIDEO_STATE.manifestPromise) {
            return WILDU_HORIZONTAL_VIDEO_STATE.manifestPromise;
        }

        WILDU_HORIZONTAL_VIDEO_STATE.manifestPromise = (async function () {
            var config = await wilduFetchYoutubeConfig();
            var manifestVersion = config && config.manifestVersion ? config.manifestVersion : "";
            var candidates = wilduYoutubeManifestCandidates(manifestVersion);
            var lastError = null;

            for (var i = 0; i < candidates.length; i++) {
                try {
                    var res = await fetch(candidates[i]);
                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    return await res.json();
                } catch (err) {
                    lastError = err;
                }
            }

            throw lastError || new Error("Manifest YouTube non leggibile.");
        })();

        return WILDU_HORIZONTAL_VIDEO_STATE.manifestPromise;
    }

    function wilduPickRandomHorizontalVideo(items) {
        var list = Array.isArray(items)
            ? items.filter(function (item) {
                return item && item.videoId;
            })
            : [];

        if (!list.length) return null;

        var lastId = "";
        try {
            lastId = sessionStorage.getItem("wildu_last_horizontal_video_id") || "";
        } catch (e) {}

        var pool = list.length > 1
            ? list.filter(function (item) { return item.videoId !== lastId; })
            : list;

        if (!pool.length) pool = list;

        var picked = pool[Math.floor(Math.random() * pool.length)];

        try {
            sessionStorage.setItem("wildu_last_horizontal_video_id", picked.videoId);
        } catch (e) {}

        return picked;
    }

    function wilduHorizontalVideoEmbedUrl(video) {
        var videoId = video && video.videoId ? String(video.videoId) : "";
        var raw = video && video.embedUrl
            ? String(video.embedUrl)
            : "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId);

        try {
            var parsed = new URL(raw, window.location.href);
            parsed.searchParams.set("rel", "0");
            parsed.searchParams.set("modestbranding", "1");
            parsed.searchParams.set("playsinline", "1");
            return parsed.toString();
        } catch (e) {
            return raw;
        }
    }

    function wilduBuildHorizontalVideoCard(video, playlist) {
        var title = video && video.title ? video.title : "Video Wild-U";
        var embedUrl = wilduHorizontalVideoEmbedUrl(video);
        var count = playlist && playlist.count ? Number(playlist.count) : 0;

        return '' +
            '<section id="wildu-news-horizontal-video-card" data-video-id="' + wilduVideoEscape(video && video.videoId ? video.videoId : '') + '" style="' +
                'margin:22px 0 0;' +
                'border-radius:24px;' +
                'overflow:hidden;' +
                'position:relative;' +
                'border:1px solid rgba(214,175,55,.28);' +
                'background:' +
                    'radial-gradient(circle at 12% 0%, rgba(214,175,55,.22), transparent 34%),' +
                    'radial-gradient(circle at 100% 100%, rgba(124,199,255,.18), transparent 35%),' +
                    'linear-gradient(135deg, rgba(16,21,18,.98), rgba(6,9,12,.98));' +
                'box-shadow:0 18px 55px rgba(0,0,0,.54);' +
            '">' +
                '<div style="' +
                    'position:absolute;' +
                    'right:-24px;' +
                    'top:-26px;' +
                    'font-size:112px;' +
                    'opacity:.045;' +
                    'transform:rotate(-10deg);' +
                    'pointer-events:none;' +
                '">🎬</div>' +

                '<div style="padding:17px 17px 15px; position:relative; z-index:1;">' +
                    '<div style="' +
                        'display:flex;' +
                        'justify-content:space-between;' +
                        'gap:10px;' +
                        'align-items:flex-start;' +
                        'flex-wrap:wrap;' +
                        'margin-bottom:13px;' +
                    '">' +
                        '<div style="min-width:0;">' +
                            '<div style="' +
                                'display:inline-flex;' +
                                'align-items:center;' +
                                'gap:7px;' +
                                'padding:6px 10px;' +
                                'border-radius:999px;' +
                                'background:rgba(214,175,55,.13);' +
                                'border:1px solid rgba(214,175,55,.28);' +
                                'color:var(--w-gold,#d6b25e);' +
                                'font-size:10px;' +
                                'font-weight:950;' +
                                'letter-spacing:.78px;' +
                                'text-transform:uppercase;' +
                                'margin-bottom:9px;' +
                            '">' +
                                '<span>▶</span><span>Video consigliato</span>' +
                            '</div>' +
                            '<h3 style="' +
                                'margin:0;' +
                                'color:#fff;' +
                                'font-size:20px;' +
                                'line-height:1.15;' +
                                'letter-spacing:.1px;' +
                            '">' + wilduVideoEscape(title) + '</h3>' +
                        '</div>' +
                        '<div style="' +
                            'display:inline-flex;' +
                            'align-items:center;' +
                            'gap:6px;' +
                            'padding:7px 10px;' +
                            'border-radius:999px;' +
                            'background:rgba(255,255,255,.07);' +
                            'border:1px solid rgba(255,255,255,.12);' +
                            'color:#d8e6dc;' +
                            'font-size:11px;' +
                            'font-weight:850;' +
                            'white-space:nowrap;' +
                        '">' +
                            '<span>shuffle</span>' +
                            (count ? '<span>· ' + count + ' video</span>' : '') +
                        '</div>' +
                    '</div>' +

                    '<div style="' +
                        'position:relative;' +
                        'width:100%;' +
                        'aspect-ratio:16/9;' +
                        'border-radius:19px;' +
                        'overflow:hidden;' +
                        'background:#050607;' +
                        'border:1px solid rgba(255,255,255,.11);' +
                        'box-shadow:0 14px 36px rgba(0,0,0,.45);' +
                    '">' +
                        '<iframe ' +
                            'title="' + wilduVideoEscape(title) + '" ' +
                            'src="' + wilduVideoEscape(embedUrl) + '" ' +
                            'loading="lazy" ' +
                            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
                            'allowfullscreen ' +
                            'style="position:absolute; inset:0; width:100%; height:100%; border:0;"' +
                        '></iframe>' +
                    '</div>' +

                    '<p style="' +
                        'margin:12px 2px 0;' +
                        'color:#aebcaf;' +
                        'font-size:12px;' +
                        'line-height:1.45;' +
                    '">' +
                        'Video selezionato dalla redazione Wild-U.' +
                    '</p>' +
                '</div>' +
            '</section>';
    }

    function wilduFindRecommendedArticleTarget(rootEl) {
        if (!rootEl) return null;

        var all = Array.prototype.slice.call(rootEl.querySelectorAll("*"));
        var wanted = null;

        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            var text = String(el.textContent || "");
            if (/articolo\s+consigliato|consigliat[oa]/i.test(text)) {
                var card = el.closest ? el.closest("article,.card,section,div") : null;
                if (card && card !== rootEl && card.parentNode) {
                    wanted = card;
                    break;
                }
            }
        }

        return wanted;
    }

    function wilduFindNewsPanelTarget(rootEl) {
        if (!rootEl) return null;

        var all = Array.prototype.slice.call(rootEl.querySelectorAll("*"));
        var best = null;

        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (!el || /^(BUTTON|A|SPAN|LABEL)$/i.test(el.tagName || "")) continue;

            var signature = [
                el.id || "",
                el.className || "",
                el.getAttribute ? (el.getAttribute("data-tab") || "") : "",
                el.getAttribute ? (el.getAttribute("data-panel") || "") : "",
                el.getAttribute ? (el.getAttribute("aria-label") || "") : ""
            ].join(" ").toLowerCase();

            if (signature.indexOf("news") !== -1 || signature.indexOf("notizie") !== -1) {
                best = el;
            }
        }

        return best;
    }

    function wilduMountHorizontalVideoCard(html, videoId) {
        var rootEl = document.getElementById("wildu-biblioteca-list");
        if (!rootEl) return false;

        var cleanVideoId = String(videoId || "");
        var old = document.getElementById("wildu-news-horizontal-video-card");

        // Anti-loop: il renderer Biblioteca può mutare il DOM più volte.
        // Se il video scelto è già montato, non ricreiamo l'iframe e non scegliamo un nuovo video.
        if (old && old.getAttribute("data-video-id") === cleanVideoId) {
            return true;
        }

        if (old && old.parentNode) {
            old.parentNode.removeChild(old);
        }

        var holder = document.createElement("div");
        holder.innerHTML = html;
        var card = holder.firstElementChild;
        if (!card) return false;

        var recommended = wilduFindRecommendedArticleTarget(rootEl);
        if (recommended && recommended.parentNode) {
            recommended.parentNode.insertBefore(card, recommended.nextSibling);
            return true;
        }

        var newsPanel = wilduFindNewsPanelTarget(rootEl);
        if (newsPanel) {
            newsPanel.appendChild(card);
            return true;
        }

        rootEl.appendChild(card);
        return true;
    }

    async function wilduRenderHorizontalVideoCard(forceNewPick) {
        var now = Date.now();

        if (WILDU_HORIZONTAL_VIDEO_STATE.rendering) {
            return;
        }

        if (!forceNewPick && WILDU_HORIZONTAL_VIDEO_STATE.mounted && now - WILDU_HORIZONTAL_VIDEO_STATE.lastRenderAt < 1200) {
            return;
        }

        WILDU_HORIZONTAL_VIDEO_STATE.rendering = true;

        try {
            var manifest = await wilduFetchYoutubeManifest();
            var playlist = manifest &&
                manifest.playlists &&
                manifest.playlists.video_horizontal
                    ? manifest.playlists.video_horizontal
                    : null;

            var mustPick = forceNewPick === true || !WILDU_HORIZONTAL_VIDEO_STATE.selectedVideo;
            if (mustPick) {
                WILDU_HORIZONTAL_VIDEO_STATE.selectedVideo = wilduPickRandomHorizontalVideo(playlist && playlist.items);
                WILDU_HORIZONTAL_VIDEO_STATE.selectedPlaylist = playlist;
            }

            var video = WILDU_HORIZONTAL_VIDEO_STATE.selectedVideo;
            if (!video) {
                console.warn("[WILDU MEDIA BIBLIOTECA] Playlist orizzontale vuota o non disponibile.");
                return;
            }

            var effectivePlaylist = WILDU_HORIZONTAL_VIDEO_STATE.selectedPlaylist || playlist;
            var ok = wilduMountHorizontalVideoCard(
                wilduBuildHorizontalVideoCard(video, effectivePlaylist),
                video.videoId
            );
            WILDU_HORIZONTAL_VIDEO_STATE.mounted = ok;
            WILDU_HORIZONTAL_VIDEO_STATE.lastRenderAt = Date.now();
        } catch (err) {
            console.warn("[WILDU MEDIA BIBLIOTECA] Video orizzontale non disponibile:", err);
        } finally {
            WILDU_HORIZONTAL_VIDEO_STATE.rendering = false;
        }
    }

    function wilduScheduleHorizontalVideoRender(forceNewPick) {
        if (WILDU_HORIZONTAL_VIDEO_STATE.renderTimer) {
            clearTimeout(WILDU_HORIZONTAL_VIDEO_STATE.renderTimer);
        }

        WILDU_HORIZONTAL_VIDEO_STATE.renderTimer = setTimeout(function () {
            WILDU_HORIZONTAL_VIDEO_STATE.renderTimer = null;
            wilduRenderHorizontalVideoCard(forceNewPick === true);
        }, forceNewPick === true ? 520 : 760);
    }

    function wilduScheduleInitialHorizontalVideoRender() {
        wilduScheduleHorizontalVideoRender(true);

        if (WILDU_HORIZONTAL_VIDEO_STATE.initialFollowupTimer) {
            clearTimeout(WILDU_HORIZONTAL_VIDEO_STATE.initialFollowupTimer);
        }

        // Follow-up senza nuova scelta: serve solo se il renderer Biblioteca monta la tab News in ritardo.
        WILDU_HORIZONTAL_VIDEO_STATE.initialFollowupTimer = setTimeout(function () {
            WILDU_HORIZONTAL_VIDEO_STATE.initialFollowupTimer = null;
            wilduRenderHorizontalVideoCard(false);
        }, 1600);
    }

    function wilduInstallHorizontalVideoObserver() {
        var rootEl = document.getElementById("wildu-biblioteca-list");
        var moduleEl = document.getElementById("wildu-biblioteca-module");
        if (!rootEl || WILDU_HORIZONTAL_VIDEO_STATE.observer) return;

        WILDU_HORIZONTAL_VIDEO_STATE.observer = new MutationObserver(function (mutations) {
            var relevant = false;

            for (var i = 0; i < mutations.length; i++) {
                var target = mutations[i] && mutations[i].target ? mutations[i].target : null;

                // Ignora le micro-mutazioni generate dal player stesso o dalla nostra card.
                if (target && target.closest && target.closest("#wildu-news-horizontal-video-card")) {
                    continue;
                }

                relevant = true;
                break;
            }

            if (relevant) {
                wilduScheduleHorizontalVideoRender(false);
            }
        });

        WILDU_HORIZONTAL_VIDEO_STATE.observer.observe(rootEl, {
            childList: true,
            subtree: true
        });

        if (moduleEl) {
            moduleEl.addEventListener("click", function (evt) {
                var target = evt && evt.target ? evt.target : null;
                var clickable = target && target.closest
                    ? target.closest("button,a,[role='tab'],[data-tab],[data-panel],[aria-controls]")
                    : null;

                if (!clickable || !moduleEl.contains(clickable)) return;

                var signature = [
                    clickable.textContent || "",
                    clickable.id || "",
                    clickable.className || "",
                    clickable.getAttribute ? (clickable.getAttribute("data-tab") || "") : "",
                    clickable.getAttribute ? (clickable.getAttribute("data-panel") || "") : "",
                    clickable.getAttribute ? (clickable.getAttribute("aria-controls") || "") : "",
                    clickable.getAttribute ? (clickable.getAttribute("aria-label") || "") : ""
                ].join(" ");

                if (/\b(news|notizie)\b/i.test(signature)) {
                    WILDU_HORIZONTAL_VIDEO_STATE.manifestPromise = null;
                    WILDU_HORIZONTAL_VIDEO_STATE.selectedVideo = null;
                    WILDU_HORIZONTAL_VIDEO_STATE.selectedPlaylist = null;
                    wilduScheduleHorizontalVideoRender(true);
                }
            }, true);
        }
    }

    wilduInstallHorizontalVideoObserver();
    wilduScheduleInitialHorizontalVideoRender();

    if (window.WILDU_MODULE && typeof window.WILDU_MODULE.rewriteRoot === "function") {
        window.WILDU_MODULE.rewriteRoot(document.getElementById("wildu-biblioteca-module"));
    }
})();
</script>

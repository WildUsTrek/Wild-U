name: Update YouTube playlists manifest

on:
  schedule:
    # Trigger giornaliero leggero.
    # Lo script aggiorna davvero solo se sono passati almeno 10 giorni,
    # salvo workflow_dispatch con force=true.
    - cron: '17 4 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Forza refresh anche se non sono passati 10 giorni'
        required: false
        default: 'true'

      target:
        description: 'all | wildwall_shorts | video_horizontal'
        required: false
        default: 'all'

      shortsPlaylistId:
        description: 'Playlist ID verticale/WildWall Shorts già normalizzato dalla Admin Suite'
        required: false
        default: ''

      horizontalPlaylistId:
        description: 'Playlist ID orizzontale già normalizzato dalla Admin Suite'
        required: false
        default: ''

      requestedByUid:
        description: 'Audit UID admin richiedente'
        required: false
        default: ''

      requestedByEmail:
        description: 'Audit email admin richiedente'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: youtube-playlists-manifest
  cancel-in-progress: false

jobs:
  update-youtube-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate YouTube playlists manifest
        env:
          WILDU_YOUTUBE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          WILDU_YOUTUBE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          WILDU_YOUTUBE_MIN_REFRESH_DAYS: '10'
          WILDU_YOUTUBE_CONFIG_OUTPUT: 'data/youtube-playlists-config.json'

          # Playlist verticale/WildWall Shorts:
          # - se arriva da GAS/Admin Suite tramite workflow_dispatch, vince shortsPlaylistId;
          # - per cron automatico lo script usa prima data/youtube-playlists-config.json,
          #   poi il manifest precedente, poi la Repository Variable come fallback di emergenza.
          WILDU_SHORTS_PLAYLIST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.shortsPlaylistId || '' }}
          WILDU_SHORTS_PLAYLIST_ID_FALLBACK: ${{ vars.WILDU_SHORTS_PLAYLIST_ID }}

          # Playlist orizzontale:
          # - se arriva da GAS/Admin Suite tramite workflow_dispatch, vince horizontalPlaylistId;
          # - per cron automatico lo script usa prima data/youtube-playlists-config.json,
          #   poi il manifest precedente, poi la Repository Variable come fallback di emergenza.
          WILDU_HORIZONTAL_PLAYLIST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.horizontalPlaylistId || '' }}
          WILDU_HORIZONTAL_PLAYLIST_ID_FALLBACK: ${{ vars.WILDU_HORIZONTAL_PLAYLIST_ID }}

          WILDU_REQUESTED_BY_UID: ${{ github.event_name == 'workflow_dispatch' && inputs.requestedByUid || '' }}
          WILDU_REQUESTED_BY_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.requestedByEmail || '' }}

        run: node tools/update-youtube-playlists.js --output=data/youtube-playlists.json --config=data/youtube-playlists-config.json

      - name: Commit manifest if changed
        run: |
          if [ -z "$(git status --porcelain -- data/youtube-playlists.json data/youtube-playlists-config.json)" ]; then
            echo "Nessun cambiamento nei manifest YouTube."
            exit 0
          fi

          git config user.name "wildu-youtube-bot"
          git config user.email "actions@github.com"
          git add data/youtube-playlists.json data/youtube-playlists-config.json
          git commit -m "Update YouTube playlists manifest"
          git push

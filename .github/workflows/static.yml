# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify executable shell release contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const remote = String(JSON.parse(fs.readFileSync('version.json', 'utf8')).version || '').trim();
          const embedded = html.match(/const WILDU_EMBEDDED_SHELL_VERSION = '([^']+)'/);
          if (!embedded || !remote || embedded[1] !== remote) {
            throw new Error('FAIL: executable shell version must exactly equal version.json before Pages deploy');
          }

          const start = html.indexOf('if (hasRecentShellReloadLock(remoteVersion, embeddedVersion)) {');
          const end = html.indexOf("    pageDebug('SHELL_VERSION_CHANGED'", start);
          const branch = start >= 0 && end > start ? html.slice(start, end) : '';
          if (!branch.includes('SHELL_RELOAD_LOCK_FAIL_OPEN') ||
              !branch.includes('return true;') ||
              branch.includes('showWilduGlobalCacheOverlay') ||
              branch.includes('SHELL_REFRESH_PENDING')) {
            throw new Error('FAIL: locked shell mismatch must be terminal fail-open, never a blocking overlay');
          }

          console.log(`PASS: executable shell release contract ${remote}`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

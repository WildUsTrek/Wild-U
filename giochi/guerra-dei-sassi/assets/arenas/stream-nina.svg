<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ce7f4"/><stop offset="1" stop-color="#dffff1"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="62%"><stop offset="0" stop-color="#ffffff" stop-opacity=".82"/><stop offset=".58" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#91d58d"/><stop offset="1" stop-color="#3d865b"/></linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83c77e"/><stop offset="1" stop-color="#4a9a65"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43b8c6"/><stop offset=".48" stop-color="#bdf5fb"/><stop offset="1" stop-color="#48bac7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="235" rx="620" ry="275" fill="url(#glow)"/>

  <!-- Raised distant hills: these sit behind the river, not on the battle floor. -->
  <g id="back-hills" opacity=".94">
    <path d="M0 500 C205 360 320 455 470 370 C625 280 755 435 895 360 C1048 270 1185 430 1600 305 L1600 900 L0 900Z" fill="#77bca9"/>
    <path d="M0 545 C260 398 365 525 540 420 C700 325 805 510 995 398 C1180 290 1330 460 1600 382 L1600 900 L0 900Z" fill="#559f87"/>
  </g>

  <!-- Tree line raised with corrected first trunk/canopy alignment. -->
  <g id="tree-line" opacity=".88" filter="url(#shadow)">
    <path d="M82 535 q42-104 84 0Z" fill="#2f8a62"/>
    <rect x="118" y="514" width="12" height="72" rx="5" fill="#38684f"/>

    <path d="M235 558 q55-132 110 0Z" fill="#3b9c66"/>
    <rect x="284" y="528" width="14" height="78" rx="5" fill="#3c7055"/>

    <path d="M1230 542 q58-128 116 0Z" fill="#2d875e"/>
    <rect x="1282" y="514" width="13" height="86" rx="5" fill="#35644d"/>

    <path d="M1390 564 q45-105 90 0Z" fill="#46a56c"/>
    <rect x="1428" y="530" width="12" height="75" rx="5" fill="#396a50"/>
  </g>

  <!-- Far bank before the water: gives the river an actual place in depth. -->
  <path id="far-bank" d="M-80 625 C210 562 380 625 610 560 C850 498 1010 610 1235 548 C1395 504 1535 522 1680 488 L1680 675 L-80 675Z" fill="url(#bank)" opacity=".93"/>

  <!-- River moved upward/backward. It no longer reaches Nina's foot zone. -->
  <g id="river" opacity=".95">
    <path d="M-80 650 C240 555 395 625 625 565 C850 505 1010 610 1245 550 C1408 508 1545 528 1680 492 L1680 720 L-80 720Z" fill="url(#water)"/>
    <path d="M-80 688 C250 606 430 665 662 615 C878 568 1022 656 1265 604 C1425 570 1545 590 1680 560 L1680 730 L-80 730Z" fill="#93e7ed" opacity=".48"/>
    <path d="M160 640 C320 608 420 636 585 603" fill="none" stroke="#eaffff" stroke-width="8" stroke-linecap="round" opacity=".56"/>
    <path d="M880 607 C1045 576 1160 605 1325 568" fill="none" stroke="#eaffff" stroke-width="7" stroke-linecap="round" opacity=".50"/>
  </g>

  <!-- Near bank and clean battle floor: Nina stands here, in front of the river. -->
  <path id="near-bank" d="M0 706 C330 676 530 705 800 686 C1070 705 1270 676 1600 706 L1600 770 L0 770Z" fill="#74b96f" opacity=".95"/>
  <path id="clean-floor" d="M0 752 C350 708 520 748 800 720 C1080 748 1245 708 1600 752 L1600 900 L0 900Z" fill="url(#floor)" opacity=".99"/>

  <g id="small-details" opacity=".72">
    <ellipse cx="244" cy="800" rx="72" ry="16" fill="#376f54" opacity=".30"/>
    <ellipse cx="1320" cy="801" rx="84" ry="18" fill="#376f54" opacity=".28"/>
    <path d="M505 770 q-14-30-30 0 M536 772 q-8-25-23 0 M1092 770 q12-28 31 0" fill="none" stroke="#8add91" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M375 724 C445 710 520 724 590 710" fill="none" stroke="#dffff4" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  </g>
</svg>
